function renderClock() {
  const d = new Date();
  $('#clock').textContent = hm(d);
  $('#todayText').textContent = d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')';
}

function periods() {
  return (state.data.periods || []).filter(p => p.start && p.end);
}

function breaks() {
  return (state.data.breaks || []).filter(b => b.start && b.end);
}

function currentPeriodInfo() {
  const nowMin = toMin(hm(new Date()));
  const list = periods();
  for (const p of list) {
    if (nowMin >= toMin(p.start) && nowMin < toMin(p.end)) return { type: 'in', period: p };
  }
  for (const b of breaks()) {
    if (nowMin >= toMin(b.start) && nowMin < toMin(b.end)) return { type: 'break', item: b };
  }
  const next = list.find(p => toMin(p.start) > nowMin);
  if (next) return { type: 'before', period: next };
  return { type: 'after' };
}

function renderToday() {
  const d = new Date();
  const dow = d.getDay();
  const tt = state.data.timetable || {};
  const list = periods();
  const box = $('#nowBox');

  if (dow < 1 || dow > 5) {
    $('#todayCount').textContent = '';
    box.innerHTML = '<div class="now-box free"><div class="now-label">오늘</div><div class="now-main">주말입니다</div><div class="now-desc">편안한 휴일 보내세요.</div></div>';
    return;
  }

  const day = DAYS[dow - 1];
  const nowMin = toMin(hm(d));
  const info = currentPeriodInfo();
  const today = todayStr();
  const count = list.filter(p => classAt(day, p.period, today)).length;
  $('#todayCount').textContent = '오늘 수업 ' + count + '시간';

  // 상태 상자
  let html;
  if (info.type === 'in') {
    const cls = classAt(day, info.period.period, today);
    const left = toMin(info.period.end) - nowMin;
    if (cls) {
      html = '<div class="now-box"><div class="now-label">지금 ' + info.period.period + '교시 수업 중</div>' +
        '<div class="now-main">' + esc(cls) + '</div>' +
        '<div class="now-desc">' + info.period.end + ' 종료 · ' + left + '분 남음</div></div>';
    } else {
      html = freeBox('지금 ' + info.period.period + '교시', '수업 없음', nextClassText(day, nowMin));
    }
  } else if (info.type === 'break') {
    const nxt = nextClass(day, nowMin);
    const left = toMin(info.item.end) - nowMin;
    html = '<div class="now-box"><div class="now-label">지금</div>' +
      '<div class="now-main">' + esc(info.item.label) + '</div>' +
      '<div class="now-desc">' + info.item.end + '까지 · ' + formatMins(left) + ' 남음' +
      (nxt ? ' · 다음 수업 ' + nxt.period + '교시 ' + esc(nxt.cls) : '') + '</div></div>';
  } else if (info.type === 'before') {
    const nxt = nextClass(day, nowMin);
    if (nxt) {
      const mins = toMin(nxt.start) - nowMin;
      html = '<div class="now-box"><div class="now-label">다음 수업 · ' + nxt.period + '교시</div>' +
        '<div class="now-main">' + esc(nxt.cls) + '</div>' +
        '<div class="now-desc">' + nxt.start + ' 시작 · ' + formatMins(mins) + ' 후</div></div>';
    } else {
      html = freeBox('오늘', '남은 수업이 없습니다', '');
    }
  } else {
    html = freeBox('오늘', '수업이 모두 끝났습니다', '수고하셨습니다.');
  }
  const todayShares = list.map(p => sharedAt(today, p.period)).reduce((a, b) => a.concat(b), []);
  box.innerHTML = html + (todayShares.length
    ? todayShares.map(sr => '<div class="share-box"><b>' + esc(sr.period) + '교시 전체 안내</b> · ' +
        esc(shareText(sr)) + '</div>').join('')
    : '');
}

function freeBox(label, main, desc) {
  return '<div class="now-box free"><div class="now-label">' + esc(label) + '</div><div class="now-main">' + esc(main) + '</div>' +
    (desc ? '<div class="now-desc">' + esc(desc) + '</div>' : '') + '</div>';
}

function nextClass(day, nowMin) {
  const today = todayStr();
  for (const p of periods()) {
    const cls = classAt(day, p.period, today);
    if (cls && toMin(p.start) > nowMin) return { period: p.period, start: p.start, cls: cls };
  }
  return null;
}

function nextClassText(day, nowMin) {
  const n = nextClass(day, nowMin);
  return n ? '다음 수업: ' + n.period + '교시 ' + n.cls + ' (' + n.start + ')' : '오늘 남은 수업이 없습니다.';
}

function formatMins(m) {
  if (m < 60) return m + '분';
  const h = Math.floor(m / 60), r = m % 60;
  return h + '시간' + (r ? ' ' + r + '분' : '');
}

// 지금 화면에 보이는 주의 월요일
function shownWeek() {
  const base = state.data.timetableWeek || ymd(mondayOf(new Date()));
  return addDays(base, (state.weekOffset || 0) * 7);
}

// 그 날짜·교시에 변경이 있으면 { cls, base }
function changeAt(date, period) {
  const c = state.data.changes || {};
  return (c[date] && c[date][String(period)]) || null;
}

// 기본 시간표에 그날 변경분을 덮어쓴 실제 수업
function classAt(day, period, date) {
  const ch = date ? changeAt(date, period) : null;
  if (ch) return ch.cls;
  return ((state.data.timetable || {})[day + period] || '').trim();
}

function renderWeek() {
  const tt = state.data.timetable || {};
  const d = new Date();
  const dow = d.getDay();
  const week = shownWeek();
  const isThisWeek = (state.weekOffset || 0) === 0;
  const todayCol = (isThisWeek && dow >= 1 && dow <= 5) ? dow - 1 : -1;
  const info = currentPeriodInfo();
  let changedCount = 0;

  // 카드 머리말: 보고 있는 주
  $('#weekInfo').textContent = shortDate(week) + ' ~ ' + shortDate(addDays(week, 4)) +
    (isThisWeek ? '' : (state.weekOffset > 0 ? ' (다음 주)' : ' (지난 주)'));
  $('#weekThis').disabled = isThisWeek;

  // 안내 문구
  const warn = $('#ttWarn');
  if (state.data.timetableFound === false) {
    warn.innerHTML = '<div class="tt-warn">시간표에서 <b>' + esc(state.data.me.name) +
      '</b> 선생님을 찾지 못했습니다. 교직원 명단의 이름과 컴시간 이름이 같은지 담당자에게 확인해 주세요.</div>';
  } else {
    warn.innerHTML = '';
  }

  let html = '<thead><tr><th class="pcol">시간/요일</th>';
  DAYS.forEach((day, i) => {
    const label = week ? day + '<br><span style="font-weight:400;color:var(--faint)">' + dayNum(week, i) + '</span>' : day;
    html += '<th class="' + (i === todayCol ? 'today' : '') + '">' + label + '</th>';
  });
  html += '</tr></thead><tbody>';

  const plist = state.data.periods || [];
  const nowMin = toMin(hm(d));
  const today = todayStr();

  const pending = breaks().slice().sort((a, b) => toMin(a.start) - toMin(b.start));

  // 일과전
  const firstP = plist.find(x => x.start);
  const lastP = plist.slice().reverse().find(x => x.end);
  const beforeSchool = todayCol >= 0 && firstP && nowMin < toMin(firstP.start);
  html += breakRowHtml_('일과전', '0', '', beforeSchool, week, todayCol);

  for (let p = 1; p <= 7; p++) {
    const pi = plist.find(x => x.period === p) || { start: '', end: '' };

    // 이 교시 시작 전에 들어가는 점심시간 등
    while (pending.length && pi.start && toMin(pending[0].start) < toMin(pi.start)) {
      const b = pending.shift();
      const isNowBreak = info.type === 'break' && info.item.label === b.label;
      html += breakRowHtml_(b.label, String(90 + breaks().indexOf(b)),
        '(' + b.start + '~' + b.end + ')', isNowBreak, week, todayCol);
    }

    const isNowRow = info.type === 'in' && info.period.period === p;
    html += '<tr class="' + (isNowRow ? 'nowrow' : '') + '"><td class="pcol">' + p + '교시' +
      (pi.start ? '<span class="ptime">(' + pi.start + '~' + pi.end + ')</span>' : '') + '</td>';
    DAYS.forEach((day, i) => {
      const key = day + p;
      const date = week ? addDays(week, i) : '';
      const ch = date ? changeAt(date, p) : null;
      const cls = ch ? ch.cls : (tt[key] || '').trim();
      const before = ch ? ch.base : '';
      const changed = !!ch;
      if (changed) changedCount++;
      const isToday = i === todayCol;
      const freeKey = freeSlotKey(day, p);
      const classes = ['cls'];
      if (cls) { classes.push('filled', 'clickable'); }
      else { classes.push('empty-cell', 'clickable'); }
      if (isToday) classes.push('today');
      if (isToday && pi.end && nowMin >= toMin(pi.end)) classes.push('done');
      if (changed) classes.push('changed');
      if (isToday && isNowRow) classes.push('nowcell');
      const key2 = cls || freeKey;
      // 그 날짜, 그 교시에 쓴 기록만 보여 준다
      const rec = date ? findRecord(key2, date, p) : null;
      const pduty = date ? dutyAtPeriod(date, p) : '';
      const prog = rec ? (rec.progress || '') : '';
      const note = (rec && !prog) ? (rec.memo || '').split('\n')[0] : '';
      html += '<td class="' + classes.join(' ') + '"' +
        ' data-cls="' + esc(key2) + '" data-day="' + i + '" data-period="' + p + '"' +
        (cls ? '' : ' data-free="1"') +
        (changed ? ' title="원래: ' + esc(before || '수업 없음') + '"' : '') + '>' +
        (cls ? esc(cls) : '') +
        (rec ? '<span class="rec-done" title="기록함">✓</span>' : '') +
        (changed ? '<span class="chg">변경</span>' : '') +
        (pduty ? '<span class="duty">' + esc(pduty) + '</span>' : '') +
        (prog ? '<span class="wprog">' + esc(prog) + '</span>' : '') +
        (note ? '<span class="note-mark">' + esc(note) + '</span>' : '') +
        (date ? sharedAt(date, p).map(sr =>
          '<span class="share-chip" data-rid="' + esc(sr.id) + '" data-date="' + esc(sr.date) +
          '" data-period="' + esc(sr.period) + '" title="전체 안내 · ' + esc(sr.author || '') + '">' +
          esc(shareText(sr)) + '</span>').join('') : '') +
        '</td>';
    });
    html += '</tr>';
  }

  // 마지막 교시 뒤에 오는 항목(청소, 종례 등)
  pending.forEach(b => {
    const isNowBreak = info.type === 'break' && info.item.label === b.label;
    html += breakRowHtml_(b.label, String(90 + breaks().indexOf(b)),
      '(' + b.start + '~' + b.end + ')', isNowBreak, week, todayCol);
  });

  // 방과후
  const afterSchool = todayCol >= 0 && lastP && nowMin >= toMin(lastP.end);
  html += breakRowHtml_('방과후', '8', '', afterSchool, week, todayCol);

  html += '</tbody>';
  $('#weekTable').innerHTML = html;

  const notes = [];
  if (changedCount) notes.push('<span class="legend"><span class="box"></span> 이번 주 변경 ' + changedCount + '칸</span>');
  notes.push('칸을 누르면 진도와 수업 기록을 쓸 수 있습니다.');
  $('#ttNote').innerHTML = notes.join(' · ');
}

// 일과전·점심·방과후 줄 (요일 칸마다 메모를 쓸 수 있다)
function breakRowHtml_(label, periodCode, timeText, isNow, week, todayCol) {
  const today = todayStr();
  let html = '<tr class="breakrow' + (isNow ? ' nowbreak' : '') + '">' +
    '<td class="pcol">' + esc(label) +
    (timeText ? '<span class="ptime">' + timeText + '</span>' : '') + '</td>';

  DAYS.forEach((day, i) => {
    const key = label + ' ' + day;
    const date = week ? addDays(week, i) : '';
    const rec = date ? findRecord(key, date, periodCode) : null;
    const duty = dutyAt(label, date);
    const cls = ['cls', 'clickable', 'breakcell'];
    if (i === todayCol) cls.push('today');
    html += '<td class="' + cls.join(' ') + '" data-cls="' + esc(key) + '" data-day="' + i +
      '" data-period="' + periodCode + '" data-free="1">' +
      (duty ? '<span class="duty">' + esc(duty) + '</span>' : '') +
      (rec ? '<span class="note-mark">' + esc((rec.memo || rec.progress || '').split('\n')[0]) + '</span>' : '') +
      '</td>';
  });
  return html + '</tr>';
}

/* ── 근무표 탭 (한 달 전체) ── */

const dutyCache = {};

function dutyMonthText(offset) {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + (offset || 0));
  return d.getFullYear() + '-' + pad(d.getMonth() + 1);
}

function moveDutyMonth(step) {
  state.dutyOffset = (state.dutyOffset || 0) + step;
  if (state.dutyOffset < -12) state.dutyOffset = -12;
  if (state.dutyOffset > 12) state.dutyOffset = 12;
  renderDutyTable();
}

// force : 새로고침 때. 보던 표는 그대로 두고 뒤에서 새로 받아 바꿔 끼운다
async function renderDutyTable(force) {
  const month = dutyMonthText(state.dutyOffset || 0);
  const body = $('#dutyBody');
  $('#dutySub').textContent = month.replace('-', '년 ') + '월';

  if (!dutyCache[month] || force) {
    const had = !!dutyCache[month];
    if (!had) body.innerHTML = '<div class="empty-msg">불러오는 중…</div>';
    try {
      dutyCache[month] = await api('dutyMonth', { key: state.key, month: month });
    } catch (e) {
      if (!had) {
        body.innerHTML = '<div class="empty-msg">' + esc(e.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      // 새로 받기에 실패하면 보던 표를 그대로 둔다
    }
    if (dutyMonthText(state.dutyOffset || 0) !== month) return;   // 그 사이 달을 바꿨으면 버린다
  }

  const data = dutyCache[month];
  const kinds = data.kinds || [];
  const days = data.days || [];

  if (!kinds.length || !days.length) {
    body.innerHTML = '<div class="empty-msg">' + month.replace('-', '년 ') + '월 근무표가 아직 없습니다.<br>' +
      '<span class="card-sub">드라이브의 근무표 폴더에 「근무표 ' + month + '」 파일이 있어야 합니다.</span></div>';
    return;
  }

  const myName = (state.data.me && state.data.me.name) || '';
  const today = todayStr();

  let html = '<div class="duty-wrap"><table class="dutytable"><thead><tr>' +
    '<th>날짜</th><th>요일</th>' +
    kinds.map(k => '<th>' + esc(k.name) +
      ((k.start && k.end) ? '<span class="dt-time">' + esc(k.start + '~' + k.end) + '</span>' : '') +
      '</th>').join('') +
    '</tr></thead><tbody>';

  days.forEach(d => {
    const dt = parseYmd(d.date);
    const dow = dt.getDay();
    const cls = [];
    if (dow === 0 || dow === 6) cls.push('weekend');
    if (d.date === today) cls.push('today');
    html += '<tr' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>' +
      '<td class="dcol">' + (dt.getMonth() + 1) + '.' + dt.getDate() + '</td>' +
      '<td class="dcol">' + DOW[dow] + '</td>' +
      kinds.map(k => {
        const list = d.cells[k.name] || [];
        if (!list.length) return '<td></td>';
        return '<td>' + list.map(x =>
          '<span class="who' + (x.who === myName ? ' me' : '') + '">' + esc(x.who) +
          (x.place ? ' <span class="pl">' + esc(x.place) + '</span>' : '') + '</span>').join('') + '</td>';
      }).join('') + '</tr>';
  });

  html += '</tbody></table></div>' +
    '<div class="tt-note">본인 근무는 붉게 표시됩니다. · 근무가 없는 날은 나오지 않습니다.</div>';
  body.innerHTML = html;
}

// 새로고침 때 근무표 탭도 새로 받는다. 지금 보는 달 말고는 기억을 비워 다시 열 때 새로 받게 한다
function refreshDutyTab() {
  const cur = dutyMonthText(state.dutyOffset || 0);
  Object.keys(dutyCache).forEach(k => { if (k !== cur) delete dutyCache[k]; });
  if (state.tab === 'duty') renderDutyTable(true);
  else delete dutyCache[cur];
}

/* ── 접속했을 때 오늘 근무 알리기 (하루 한 번) ── */

function dutyPopupKey() { return 'ssgh_duty_' + todayStr(); }

function maybeDutyPopup() {
  let seen = null;
  try {
    seen = localStorage.getItem(dutyPopupKey());
    for (let i = localStorage.length - 1; i >= 0; i--) {      // 지난 날짜 표시는 지운다
      const k = localStorage.key(i);
      if (k && k.indexOf('ssgh_duty_') === 0 && k !== dutyPopupKey()) localStorage.removeItem(k);
    }
  } catch (e) { }
  if (seen) return;

  const today = todayStr();
  const list = (state.data.duties || []).filter(d => d.date === today);
  if (!list.length) return;

  const now = hm(new Date());
  const rows = list.map(d => {
    let time = (d.start && d.end) ? (d.start + ' ~ ' + d.end) : '';
    if (!time && d.slot === '교시' && d.period) {
      const pi = (state.data.periods || []).find(x => Number(x.period) === Number(d.period));
      time = d.period + '교시' + (pi && pi.start ? ' (' + pi.start + ')' : '');
    }
    const past = !!(d.end && now > d.end);
    return '<li' + (past ? ' class="past"' : '') + '>' +
      '<span class="dp-time">' + esc(time || '시간 미정') + '</span>' +
      '<span class="dp-text">' + esc(d.text) + (past ? ' <span class="dp-done">(끝남)</span>' : '') + '</span>' +
      '</li>';
  }).join('');

  openModal(
    '<h2>오늘 근무가 있습니다</h2>' +
    '<div class="meta">' + shortDate(today) + ' · ' + list.length + '건</div>' +
    '<ul class="duty-pop">' + rows + '</ul>' +
    '<div class="modal-actions"><button class="btn btn-primary" id="dpOk" type="button">확인</button></div>'
  );

  $('#dpOk').onclick = () => {
    try { localStorage.setItem(dutyPopupKey(), '1'); } catch (e) { }
    closeModal();
  };
}

// 근무표(있으면)에서 그 날짜의 내 담당 찾기
function dutyAt(label, date) {
  const list = state.data.duties || [];
  const hit = list.find(d => d.date === date && d.slot === label);
  return hit ? (hit.text || '담당') : '';
}

// 교시마다 정해지는 근무 (SLAT 감독 등)
function dutyAtPeriod(date, period) {
  const list = state.data.duties || [];
  const hits = list.filter(d => d.date === date && d.slot === '교시' && Number(d.period) === Number(period));
  if (!hits.length) return '';
  return hits.map(d => (d.duty || '근무') + (d.place ? ' ' + d.place.replace(/^\d{1,2}교시\s*/, '') : '')).join(' / ');
}

// 주 시작일(월요일)에서 i번째 요일의 날짜 표시 (9/14 형태)
function dayNum(weekStart, i) {
  const d = parseYmd(weekStart);
  d.setDate(d.getDate() + i);
  return (d.getMonth() + 1) + '/' + d.getDate();
}

/* ── 학생 자율학습 출결 ── */
// 출석부 시트(드라이브 '학생출결확인' 폴더)를 서버가 읽어 날짜별로 보내 준다
const attCache = {};
let attTimer = null;

function attDateText() {
  const d = new Date();
  d.setDate(d.getDate() + (state.attOffset || 0));
  return ymd(d);
}

function moveAttDay(step) {
  state.attOffset = (state.attOffset || 0) + step;
  if (state.attOffset > 7) state.attOffset = 7;
  state.attSel = '';
  loadAttend();
}

// force : 저장해 둔 것을 쓰지 않고 새로 받는다
async function loadAttend(force) {
  state.attMode = 'day';
  const date = attDateText();
  $('#attSub').textContent = shortDate(date);
  $('#attDate').value = date;
  const body = $('#attBody');
  const had = !!attCache[date];

  if (!had || force) {
    if (!had) body.innerHTML = '<div class="empty-msg">불러오는 중…</div>';
    try {
      attCache[date] = await api('attendDay', { key: state.key, date: date });
    } catch (e) {
      if (!had) {
        body.innerHTML = '<div class="empty-msg">' + esc(e.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
    }
    if (attDateText() !== date) return;   // 그 사이 날짜를 바꿨으면 버린다
  }
  renderAttend();
  scheduleAttend();
}

// 오늘을 보고 있는 동안 1분마다 다시 받는다
function scheduleAttend() {
  clearTimeout(attTimer);
  if (state.tab !== 'attend' || state.attMode === 'range' || (state.attOffset || 0) !== 0) return;
  attTimer = setTimeout(() => {
    if (state.attMode === 'range') return;
    if (state.tab === 'attend' && !document.hidden) loadAttend(true);
    else scheduleAttend();
  }, 60000);
}

// 지금 보고 있는 방식(하루 / 기간) 그대로 다시 받기
function attRefresh(force) {
  if (state.attMode === 'range') loadAttRange(force);
  else loadAttend(force);
}

/* ── 기간 조회 : 출석기록만으로 학생별 합계와 날짜별 기록 ── */
const attRangeCache = {};
const ATT_RANGE_MAX = 120;

async function loadAttRange(force) {
  state.attMode = 'range';
  clearTimeout(attTimer);
  let from = $('#attFrom').value, to = $('#attTo').value;
  const today = todayStr();
  if (!from) from = today.slice(0, 8) + '01';
  if (!to) to = today;
  if (to < from) { const t = from; from = to; to = t; }
  $('#attFrom').value = from;
  $('#attTo').value = to;
  const body = $('#attBody');
  if (diffDays(from, to) > ATT_RANGE_MAX) {
    body.innerHTML = '<div class="empty-msg">기간은 ' + ATT_RANGE_MAX + '일까지 조회할 수 있습니다.</div>';
    return;
  }
  const k = from + '_' + to;
  $('#attSub').textContent = shortDate(from) + ' ~ ' + shortDate(to);
  if (!attRangeCache[k] || force) {
    body.innerHTML = '<div class="empty-msg">불러오는 중…</div>';
    try {
      attRangeCache[k] = await api('attendRange', { key: state.key, from: from, to: to });
    } catch (e) {
      body.innerHTML = '<div class="empty-msg">' + esc(e.message || '불러오지 못했습니다.') + '</div>';
      return;
    }
  }
  if (state.attMode !== 'range') return;
  state.attRangeKey = k;
  renderAttRange();
}

function attRowState(r) {
  return {
    state: r.inStatus === '결석' ? 'absent' : (r.inTime ? (r.outTime ? 'out' : 'in') : 'none'),
    inStatus: r.inStatus, outStatus: r.outStatus
  };
}

function attRangeRows() {
  const data = attRangeCache[state.attRangeKey];
  if (!data || !data.found) return [];
  const sess = state.attRangeSess || '';
  const q = ($('#attSearch').value || '').trim();
  return (data.rows || []).filter(r => (!sess || r.sname === sess) &&
    (!q || r.id.indexOf(q) >= 0 || (r.name || '').indexOf(q) >= 0));
}

function renderAttRange() {
  const data = attRangeCache[state.attRangeKey];
  const body = $('#attBody');
  if (!data) return;
  if (!data.found) {
    body.innerHTML = '<div class="empty-msg">출석부 시트를 찾지 못했습니다.</div>';
    return;
  }

  const sessNames = (data.rows || []).map(r => r.sname).filter((x, i, a) => x && a.indexOf(x) === i).sort();
  if (state.attRangeSess && sessNames.indexOf(state.attRangeSess) < 0) state.attRangeSess = '';
  const rows = attRangeRows();
  const onlyMiss = $('#attOnlyMiss').checked;

  // 학생별 합계
  const by = {};
  rows.forEach(r => {
    const s = by[r.id] = by[r.id] || { id: r.id, name: '', n: 0, late: 0, early: 0, absent: 0, noOut: 0, rows: [] };
    if (!s.name && r.name) s.name = r.name;
    s.rows.push(r);
    if (r.inTime) s.n++;
    if (r.inStatus === '지각') s.late++;
    if (r.outStatus === '조퇴') s.early++;
    if (r.inStatus === '결석') s.absent++;
    if (r.outStatus === '퇴실누락') s.noOut++;
  });
  let list = Object.keys(by).map(k => by[k]).sort((a, b) => a.id.localeCompare(b.id, 'ko', { numeric: true }));
  if (onlyMiss) list = list.filter(s => s.absent > 0);
  if (list.length === 1) state.attRangeSel = list[0].id;
  const sel = list.find(s => s.id === state.attRangeSel);

  let html = '<div class="att-rangebar"><b>기간 조회</b>' +
    '<span class="card-sub">' + esc(data.from) + ' ~ ' + esc(data.to) + ' · 기록 ' + rows.length + '건 · 학생 ' + list.length + '명</span>' +
    '<span class="grow"></span>' +
    '<select class="att-date" id="attRangeSess"><option value="">모든 타임</option>' +
    sessNames.map(n => '<option value="' + esc(n) + '"' + (n === state.attRangeSess ? ' selected' : '') + '>' + esc(n) + '</option>').join('') +
    '</select>' +
    '<button class="btn" id="attCsv" type="button">CSV 내려받기</button>' +
    '<button class="btn" id="attBack" type="button">하루 보기로</button></div>';

  html += '<div class="att-wrap" style="max-height:45vh"><table class="atttable"><thead><tr>' +
    '<th>학번</th><th>이름</th><th>출석</th><th>지각</th><th>조퇴</th><th>결석</th><th>퇴실누락</th></tr></thead><tbody>';
  if (!list.length) {
    html += '<tr><td colspan="7" class="empty-msg">' + (onlyMiss ? '결석한 학생이 없습니다.' : '이 기간에 기록이 없습니다.') + '</td></tr>';
  }
  list.forEach(s => {
    const z = (n, cls) => n ? '<span class="' + cls + '">' + n + '</span>' : '<span class="card-sub">0</span>';
    html += '<tr class="pick' + (sel && sel.id === s.id ? ' on' : '') + '" data-stu="' + esc(s.id) + '">' +
      '<td class="num">' + esc(s.id) + '</td><td>' + esc(s.name) + '</td>' +
      '<td class="num">' + s.n + '</td>' +
      '<td class="num">' + z(s.late, 'att-warn') + '</td>' +
      '<td class="num">' + z(s.early, 'att-warn') + '</td>' +
      '<td class="num">' + z(s.absent, 'att-bad') + '</td>' +
      '<td class="num">' + z(s.noOut, 'att-warn') + '</td></tr>';
  });
  html += '</tbody></table></div>';

  if (sel) {
    html += '<div class="att-detail-title">' + esc(sel.id) + ' ' + esc(sel.name) + ' · 날짜별 기록</div>' +
      '<div class="att-wrap" style="max-height:none"><table class="atttable"><thead><tr>' +
      '<th>날짜</th><th>타임</th><th>장소</th><th>입실</th><th>퇴실</th><th>상태</th><th>비고</th></tr></thead><tbody>' +
      sel.rows.map(r => '<tr class="st-' + attRowState(r).state + '">' +
        '<td class="num">' + esc(shortDate(r.date)) + '</td><td>' + esc(r.sname) + '</td><td>' + esc(r.room) + '</td>' +
        '<td class="num">' + esc(r.inTime || '-') + '</td><td class="num">' + esc(r.outTime || '-') + '</td>' +
        '<td>' + attStateTag(attRowState(r), r.kind) + '</td><td class="card-sub">' + esc(r.note || '') + '</td></tr>').join('') +
      '</tbody></table></div>';
  } else if (list.length) {
    html += '<div class="tt-note">학생을 누르면 날짜별 기록이 나옵니다.</div>';
  }
  html += '<div class="tt-note">출석기록 시트에 남은 기록으로 만듭니다. 결석은 자동 정리가 남긴 기록이라, 오늘 아직 안 온 학생은 하루 보기에서 확인하세요.</div>';
  body.innerHTML = html;
}

function downloadAttCsv() {
  const data = attRangeCache[state.attRangeKey];
  if (!data) return;
  const rows = attRangeRows();
  const cell = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [['날짜', '구분', '타임', '장소', '학번', '이름', '입실', '입실상태', '퇴실', '퇴실상태', '비고'].join(',')]
    .concat(rows.map(r => [r.date, r.kind === 'slat' ? '공강' : '자율학습', r.sname, r.room, r.id, r.name, r.inTime, r.inStatus, r.outTime, r.outStatus, r.note].map(cell).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '학생출결_' + data.from + '_' + data.to + (state.attRangeSess ? '_' + state.attRangeSess : '') + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function attStateTag(st, kind) {
  if (st.state === 'none') return '<span class="st-tag none">미입실</span>';
  if (st.state === 'absent') return '<span class="st-tag absent">결석</span>';
  const tags = [];
  if (st.state === 'in') tags.push('<span class="st-tag in">' + (kind === 'slat' ? '출석' : '자습 중') + '</span>');
  if (st.state === 'out') tags.push('<span class="st-tag out">퇴실</span>');
  if (st.inStatus === '지각') tags.push('<span class="st-tag warn">지각</span>');
  if (st.outStatus === '조퇴') tags.push('<span class="st-tag warn">조퇴</span>');
  if (st.outStatus === '퇴실누락') tags.push('<span class="st-tag warn">퇴실누락</span>');
  return tags.join(' ');
}

function renderAttend() {
  if (state.attMode === 'range') { renderAttRange(); return; }
  const data = attCache[attDateText()];
  const body = $('#attBody');
  if (!data) return;

  if (!data.found) {
    body.innerHTML = '<div class="empty-msg">출석부 시트를 찾지 못했습니다.<br>' +
      '<span class="card-sub">드라이브의 「학생출결확인」 폴더에 「자율학습 출석부」 시트가 있어야 합니다.</span></div>';
    return;
  }
  const list = data.sessions || [];
  if (!list.length) {
    body.innerHTML = '<div class="empty-msg">이 날은 자율학습·공강 타임이 없습니다.</div>';
    return;
  }

  // 고른 타임이 없으면 진행 중인 타임 → 첫 타임
  if (!state.attSel || !list.some(s => s.id === state.attSel)) {
    const live = list.find(s => s.live);
    state.attSel = (live || list[0]).id;
  }

  const q = ($('#attSearch').value || '').trim();
  const onlyMiss = $('#attOnlyMiss').checked;

  // 타임명이 같으면 같은 색 [테두리, 바탕]
  const ATT_COLORS = [['#3f7cc4', '#eaf2fb'], ['#d0812f', '#fcf1e4'], ['#4f9a58', '#eaf5ec'],
                      ['#9a5bb5', '#f4ecf8'], ['#c2556b', '#fbeaee'], ['#3a9a9a', '#e5f4f4']];
  const SLAT_COLOR = ['#5f6f86', '#eef1f6'];   // 공강 카드는 모두 이 색
  const colorOf = {};
  list.forEach(s => {
    if (s.kind === 'slat') return;
    const k = s.name || s.id;
    if (!colorOf[k]) colorOf[k] = ATT_COLORS[Object.keys(colorOf).length % ATT_COLORS.length];
  });

  let html = '<div class="att-sum">' + list.map(s => {
    const c = s.counts;
    const miss = c.none + c.absent;
    const slat = s.kind === 'slat';
    const col = slat ? SLAT_COLOR : colorOf[s.name || s.id];
    return '<button type="button" class="att-box grp' + (s.live ? ' live' : '') + (s.id === state.attSel ? ' sel' : '') +
      '" style="--g:' + col[0] + ';--gt:' + col[1] + '" data-sid="' + esc(s.id) + '">' +
      '<div class="ab-name">' + (slat ? '<span class="att-kind">공강</span>' : '') + esc(s.name) +
        (s.live ? '<span class="att-live">진행 중</span>' : '') + '</div>' +
      '<div class="ab-meta">' + esc(s.room) + ' · ' + esc(s.start) + '~' + esc(s.end) + '</div>' +
      '<div class="ab-num">' +
        '<span>배정 <b>' + c.assigned + '</b></span>' +
        '<span>입실 <b>' + c.in + '</b></span>' +
        (miss ? '<span class="att-bad">' + (s.ended ? '결석' : '미입실') + ' <b>' + miss + '</b></span>' : '') +
        (c.late ? '<span class="att-warn">지각 <b>' + c.late + '</b></span>' : '') +
        (c.early ? '<span class="att-warn">조퇴 <b>' + c.early + '</b></span>' : '') +
        (c.extra ? '<span>미배정 <b>' + c.extra + '</b></span>' : '') +
      '</div></button>';
  }).join('') + '</div>';

  // 검색어가 있으면 모든 타임에서 찾고, 없으면 고른 타임만
  const rows = [];
  list.forEach(s => {
    if (!q && s.id !== state.attSel) return;
    s.students.forEach(st => {
      if (q && st.id.indexOf(q) < 0 && (st.name || '').indexOf(q) < 0) return;
      if (onlyMiss && st.state !== 'none' && st.state !== 'absent') return;
      rows.push({ s: s, st: st });
    });
  });
  const rank = { none: 0, absent: 0, in: 1, out: 2 };
  rows.sort((a, b) => (rank[a.st.state] - rank[b.st.state]) || (a.st.id < b.st.id ? -1 : 1));

  const showSess = !!q;
  const selS = list.find(s => s.id === state.attSel);
  const showOut = showSess || !(selS && selS.kind === 'slat');   // 공강은 퇴실이 없음
  html += '<div class="att-wrap"><table class="atttable"><thead><tr>' +
    (showSess ? '<th>타임</th>' : '') +
    '<th>학번</th><th>이름</th><th>입실</th>' + (showOut ? '<th>퇴실</th>' : '') + '<th>상태</th><th>비고</th></tr></thead><tbody>';
  if (!rows.length) {
    html += '<tr><td colspan="' + (5 + (showSess ? 1 : 0) + (showOut ? 1 : 0)) + '" class="empty-msg">' +
      (q ? '찾는 학생이 없습니다.' : onlyMiss ? '미입실·결석 학생이 없습니다.' : '배정되거나 출석한 학생이 없습니다.') + '</td></tr>';
  }
  rows.forEach(({ s, st }) => {
    html += '<tr class="st-' + st.state + '">' +
      (showSess ? '<td>' + esc(s.name) + '</td>' : '') +
      '<td class="num">' + esc(st.id) + '</td>' +
      '<td>' + esc(st.name) + '</td>' +
      '<td class="num">' + esc(st.inTime || '-') + '</td>' +
      (showOut ? '<td class="num">' + esc(st.outTime || '-') + '</td>' : '') +
      '<td>' + attStateTag(st, s.kind) + '</td>' +
      '<td class="card-sub">' + (st.assigned ? '' : '미배정') + '</td></tr>';
  });
  html += '</tbody></table></div>' +
    '<div class="tt-note">' + (data.date === data.today ? '1분마다 자동으로 새로 받습니다. · ' : '') +
    '받은 시각 ' + esc(data.now || '') + ' · 배정 명단과 시간표는 출석부 시트에서 고칩니다.</div>';
  body.innerHTML = html;
}

/* ── 메뉴(탭) 전환 ── */

const TABS = ['timetable', 'notice', 'duty', 'attend', 'links'];
const TAB_KEY = 'ssgh_dash_tab';

function switchTab(name, remember) {
  if (TABS.indexOf(name) < 0) name = TABS[0];
  state.tab = name;
  document.querySelectorAll('nav.tabs .tab').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === name);
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('hidden', p.dataset.panel !== name);
  });
  if (remember !== false) {
    try { localStorage.setItem(TAB_KEY, name); } catch (e) {}
    if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  }
  window.scrollTo({ top: 0 });
  if (name === 'duty' && state.data) renderDutyTable();
  if (name === 'attend' && state.data) attRefresh();
}

function initTab() {
  const fromHash = (location.hash || '').replace('#', '');
  let saved = '';
  try { saved = localStorage.getItem(TAB_KEY) || ''; } catch (e) {}
  switchTab(TABS.indexOf(fromHash) >= 0 ? fromHash : (saved || TABS[0]));
}

/* ── 바로가기 ── */

/* ───────────── 내 바로가기 (선생님마다, 이 브라우저에만 저장) ───────────── */

const MYL_PREFIX = 'ssgh_mylinks:';
const MYL_MAX = 40;
const MYL_COLORS = ['#3f7cc4', '#4f9a58', '#d0812f', '#9a5bb5', '#c2556b', '#3a9a9a', '#7a6a3a', '#5f6f86'];
const myl = { edit: false, form: null, drag: -1 };   // form: null | { idx: -1(새로) 또는 고칠 번호 }

function mylKey() { return MYL_PREFIX + ((state.data && state.data.me && state.data.me.name) || ''); }
function mylLoad() {
  try {
    const a = JSON.parse(localStorage.getItem(mylKey()) || '[]');
    return Array.isArray(a) ? a.filter(x => x && x.name && /^https?:\/\//i.test(x.url)) : [];
  } catch (e) { return []; }
}
function mylSave(list) {
  try { localStorage.setItem(mylKey(), JSON.stringify(list)); return true; }
  catch (e) { toast('이 브라우저에는 저장할 수 없습니다.', true); return false; }
}
function mylUrl(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) && x.hostname ? x.href : ''; } catch (e) { return ''; }
}
function mylSame(a, b) { return String(a || '').replace(/\/+$/, '') === String(b || '').replace(/\/+$/, ''); }
function mylColor(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return MYL_COLORS[h % MYL_COLORS.length];
}
function mylStar(l) {
  const on = mylLoad().some(x => mylSame(x.url, l.url));
  return '<button type="button" class="link-star' + (on ? ' on' : '') + '" data-url="' + esc(l.url) + '" data-name="' + esc(l.name) +
    '" title="' + (on ? '내 바로가기에서 빼기' : '내 바로가기에 담기') + '">' + (on ? '★' : '☆') + '</button>';
}

function renderMyLinks() {
  const box = $('#myLinks');
  if (!box || !state.data) return;
  const list = mylLoad();
  box.classList.toggle('editing', myl.edit);

  let tiles;
  if (!list.length) {
    tiles = '<button type="button" class="myl-tile myl-empty" data-act="add">＋ 자주 쓰는 사이트를 추가하세요</button>';
  } else {
    tiles = list.map((l, i) => {
      const inner = '<span class="myl-ico" style="background:' + mylColor(l.name) + '">' + esc(Array.from(l.name)[0] || '·') + '</span>' +
        '<span class="myl-name">' + esc(l.name) + '</span>';
      if (myl.edit) {
        return '<div class="myl-tile" draggable="true" data-i="' + i + '" title="끌어서 순서 바꾸기">' + inner +
          '<span class="myl-tools"><button type="button" data-act="fix" data-i="' + i + '" title="고치기">✎</button>' +
          '<button type="button" class="del" data-act="del" data-i="' + i + '" title="지우기">✕</button></span></div>';
      }
      return '<a class="myl-tile" href="' + esc(l.url) + '" target="_blank" rel="noopener" title="' + esc(l.url) + '">' + inner + '</a>';
    }).join('');
  }

  let html = '<div class="myl-bar">' +
    '<span class="myl-label" title="이 컴퓨터, 이 브라우저에만 저장됩니다">내 바로가기</span>' +
    '<div class="myl-list" id="mylList">' + tiles + '</div>' +
    (myl.edit
      ? '<button type="button" class="btn btn-primary" data-act="done">완료</button>'
      : '<button type="button" class="btn myl-btn" data-act="add" title="추가">＋</button>' +
        (list.length ? '<button type="button" class="btn myl-btn" data-act="edit" title="편집 (고치기·지우기·순서)">⚙</button>' : '')) +
    '</div>';

  if (myl.form) {
    const cur = myl.form.idx >= 0 ? list[myl.form.idx] || {} : {};
    html += '<form class="myl-form" id="mylForm" autocomplete="off">' +
      '<div><label for="mylName">이름</label><input class="input" id="mylName" maxlength="30" value="' + esc(cur.name || '') + '" placeholder="예: 나이스"></div>' +
      '<div><label for="mylUrlIn">주소</label><input class="input" id="mylUrlIn" maxlength="2000" value="' + esc(cur.url || '') + '" placeholder="예: neis.go.kr"></div>' +
      '<div style="display:flex;gap:6px"><button type="button" class="btn" data-act="cancel">취소</button>' +
      '<button type="submit" class="btn btn-primary">' + (myl.form.idx >= 0 ? '저장' : '추가') + '</button></div>' +
      '<div class="err" id="mylErr"></div></form>';
  }

  if (myl.edit) {
    html += '<div class="myl-foot"><span>🔒 이 컴퓨터·이 브라우저에만 저장됩니다. 끌어서 순서를 바꿀 수 있습니다.</span>' +
      '<button type="button" data-act="export">내보내기</button><button type="button" data-act="import">가져오기</button>' +
      '<span>(다른 컴퓨터로 옮길 때)</span></div>';
  }
  box.innerHTML = html;
  if (myl.form) setTimeout(() => { const n = $('#mylName'); if (n) n.focus(); }, 0);
}

function mylSubmit() {
  const name = ($('#mylName').value || '').trim();
  const url = mylUrl($('#mylUrlIn').value);
  const err = $('#mylErr');
  if (!name) { err.textContent = '이름을 적어 주세요.'; return; }
  if (!url) { err.textContent = '주소가 올바르지 않습니다. 예: https://neis.go.kr'; return; }
  const list = mylLoad();
  if (myl.form.idx >= 0) list[myl.form.idx] = { name, url };
  else {
    if (list.length >= MYL_MAX) { err.textContent = '최대 ' + MYL_MAX + '개까지 저장할 수 있습니다.'; return; }
    list.push({ name, url });
  }
  if (!mylSave(list)) return;
  myl.form = null;
  renderMyLinks();
  renderLinks();
}

function mylExport() {
  const list = mylLoad();
  const blob = new Blob([JSON.stringify({ type: 'ssgh-mylinks', v: 1, links: list }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '내바로가기_' + ((state.data.me && state.data.me.name) || '') + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function mylImport() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let src;
      try { src = JSON.parse(r.result); } catch (e) { toast('내 바로가기 파일이 아닙니다.', true); return; }
      const items = (Array.isArray(src) ? src : (src && src.links) || [])
        .map(x => ({ name: String((x && x.name) || '').trim().slice(0, 30), url: mylUrl(x && x.url) }))
        .filter(x => x.name && x.url);
      if (!items.length) { toast('가져올 바로가기가 없습니다.', true); return; }
      const list = mylLoad();
      let added = 0;
      items.forEach(x => {
        if (list.length < MYL_MAX && !list.some(y => mylSame(y.url, x.url))) { list.push(x); added++; }
      });
      if (mylSave(list)) { renderMyLinks(); renderLinks(); toast(added + '개를 가져왔습니다.'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

function initMyLinks() {
  const box = $('#myLinks');
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act, i = Number(b.dataset.i);
    if (act === 'add') { myl.form = { idx: -1 }; }
    else if (act === 'edit') { myl.edit = true; }
    else if (act === 'done') { myl.edit = false; myl.form = null; }
    else if (act === 'cancel') { myl.form = null; }
    else if (act === 'fix') { myl.form = { idx: i }; }
    else if (act === 'del') {
      if (!b.classList.contains('confirm')) { b.classList.add('confirm'); b.textContent = '?'; b.title = '한 번 더 누르면 지웁니다'; return; }
      const list = mylLoad(); list.splice(i, 1); mylSave(list);
      if (!list.length) myl.edit = false;
      myl.form = null; renderLinks();
    }
    else if (act === 'export') { mylExport(); return; }
    else if (act === 'import') { mylImport(); return; }
    renderMyLinks();
  });
  box.addEventListener('submit', e => { e.preventDefault(); mylSubmit(); });
  box.addEventListener('keydown', e => { if (e.key === 'Escape' && myl.form) { myl.form = null; renderMyLinks(); } });

  // 세로 휠로도 옆으로 넘기기
  box.addEventListener('wheel', e => {
    const l = e.target.closest('.myl-list');
    if (l && l.scrollWidth > l.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { l.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });

  // 끌어서 순서 바꾸기 (편집 중)
  box.addEventListener('dragstart', e => {
    const t = e.target.closest('.myl-tile[data-i]');
    if (!t) return;
    myl.drag = Number(t.dataset.i);
    t.classList.add('drag');
    try { e.dataTransfer.setData('text/plain', String(myl.drag)); e.dataTransfer.effectAllowed = 'move'; } catch (x) {}
  });
  box.addEventListener('dragover', e => {
    const t = e.target.closest('.myl-tile[data-i]');
    if (!t || myl.drag < 0) return;
    e.preventDefault();
    box.querySelectorAll('.myl-tile.over').forEach(x => x.classList.remove('over'));
    t.classList.add('over');
  });
  box.addEventListener('drop', e => {
    const t = e.target.closest('.myl-tile[data-i]');
    if (!t || myl.drag < 0) return;
    e.preventDefault();
    const to = Number(t.dataset.i), from = myl.drag;
    myl.drag = -1;
    if (to === from) { renderMyLinks(); return; }
    const list = mylLoad();
    const [it] = list.splice(from, 1);
    list.splice(to, 0, it);
    mylSave(list);
    renderMyLinks();
  });
  box.addEventListener('dragend', () => { myl.drag = -1; box.querySelectorAll('.drag,.over').forEach(x => x.classList.remove('drag', 'over')); });

  // 부서별 업무의 ☆ : 내 바로가기에 담기·빼기
  $('#linkBody').addEventListener('click', e => {
    const s = e.target.closest('.link-star');
    if (!s) return;
    e.preventDefault();
    e.stopPropagation();
    const list = mylLoad();
    const k = list.findIndex(x => mylSame(x.url, s.dataset.url));
    if (k >= 0) { list.splice(k, 1); toast('내 바로가기에서 뺐습니다.'); }
    else {
      if (list.length >= MYL_MAX) { toast('최대 ' + MYL_MAX + '개까지 저장할 수 있습니다.', true); return; }
      list.push({ name: s.dataset.name.slice(0, 30), url: s.dataset.url });
      toast('내 바로가기에 담았습니다. 시간표 화면 위에 보입니다.');
    }
    if (mylSave(list)) { renderLinks(); renderMyLinks(); }
  });
}

function renderLinks() {
  const list = (state.data.links || []).filter(l => l.name && /^https?:\/\//i.test(l.url));
  $('#linkCount').textContent = list.length ? '업무 ' + list.length + '개' : '';
  if (!list.length) {
    $('#linkBody').innerHTML = '<div class="empty-msg">바로가기가 등록되지 않았습니다. 시트의 바로가기 탭에 업무명과 주소를 적어 주세요.</div>';
    return;
  }

  const groups = [];
  list.forEach(l => {
    const g = l.group || '';
    let bucket = groups.find(x => x.name === g);
    if (!bucket) { bucket = { name: g, items: [] }; groups.push(bucket); }
    bucket.items.push(l);
  });

  // 부서 순서: 숫자면 숫자 순, 아니면 처음 나온 순서
  groups.sort((a, b) => {
    const na = Number(a.name), nb = Number(b.name);
    const aNum = a.name !== '' && !isNaN(na), bNum = b.name !== '' && !isNaN(nb);
    if (aNum && bNum) return na - nb;
    if (aNum !== bNum) return aNum ? -1 : 1;
    return 0;
  });

  $('#linkBody').innerHTML = '<div class="link-grid">' + groups.map(g =>
    '<div class="link-group">' +
      '<div class="link-group-title">' + esc(g.name || '기타') +
        '<span class="cnt">' + g.items.length + '</span></div>' +
      '<div class="link-row">' + g.items.map(l =>
        '<a class="link-btn" href="' + esc(l.url) + '" target="_blank" rel="noopener" title="' + esc(l.url) + '">' +
        '<span class="ico">↗</span><span>' + esc(l.name) +
        (l.note ? '<span class="link-note">' + esc(l.note) + '</span>' : '') +
        '</span>' + mylStar(l) + '</a>').join('') +
      '</div>' +
    '</div>').join('') + '</div>';
}

/* ── 급식 ── */

function meals() { return state.data.meals || []; }

function mealDates() {
  const set = {};
  meals().forEach(m => { if (m.date) set[m.date] = true; });
  return Object.keys(set).sort();
}

function renderMeal() {
  const list = meals();
  const body = $('#mealBody');
  const dates = mealDates();

  if (!dates.length) {
    $('#mealKcal').textContent = '';
    body.innerHTML = '<div class="empty-msg">앞으로 2주간 급식 정보가 없습니다.</div>';
    ['#mealPrev', '#mealNext', '#mealToday'].forEach(s => { $(s).disabled = true; });
    return;
  }

  // 기본값: 오늘, 오늘 급식이 없으면 가장 가까운 다음 급식일
  if (!state.mealDate) {
    const today = todayStr();
    state.mealDate = dates.indexOf(today) >= 0 ? today : (dates.find(d => d >= today) || dates[0]);
  }

  const idx = dates.indexOf(state.mealDate);
  $('#mealPrev').disabled = idx <= 0;
  $('#mealNext').disabled = idx < 0 || idx >= dates.length - 1;
  $('#mealToday').disabled = false;

  const todays = list.filter(m => m.date === state.mealDate);
  $('#mealKcal').textContent = todays.map(m => m.kcal).filter(k => k).join(' · ');

  const label = shortDate(state.mealDate) +
    (state.mealDate === todayStr() ? ' · 오늘'
      : state.mealDate === addDays(todayStr(), 1) ? ' · 내일' : '');

  if (!todays.length) {
    body.innerHTML = '<div class="meal-date">' + label + '</div>' +
      '<div class="empty-msg">급식이 없는 날입니다.</div>';
    return;
  }

  body.innerHTML = '<div class="meal-date">' + label + '</div>' +
    todays.map(m =>
      (todays.length > 1 ? '<div class="meal-date">' + esc(m.type) + '</div>' : '') +
      '<ul class="meal-list">' + m.dishes.map((d, i) =>
        '<li class="' + (i === 0 ? 'main' : '') + '">' + esc(d) + '</li>').join('') + '</ul>'
    ).join('');
}

function moveMeal(step) {
  const dates = mealDates();
  const idx = dates.indexOf(state.mealDate);
  const next = idx + step;
  if (next < 0 || next >= dates.length) return;
  state.mealDate = dates[next];
  renderMeal();
}

function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - diff);
  return x;
}
function addDays(dateStr, n) {
  const d = parseYmd(dateStr);
  d.setDate(d.getDate() + n);
  return ymd(d);
}

/* ── 수업 기록 ── */

function records() { return state.data.records || []; }
function recordsFor(cls) {
  return records().filter(r => r.cls === cls)
    .sort((a, b) => (a.date !== b.date ? (a.date < b.date ? 1 : -1) : Number(b.period) - Number(a.period)));
}
function latestProgress(cls) {
  const r = recordsFor(cls).find(x => x.progress);
  return r ? r.progress : '';
}
// 수업이 없는 칸의 기록 이름 (예: 빈시간 금5)
function freeSlotKey(day, period) { return '빈시간 ' + day + period; }
function isFreeSlot(cls) { return /^빈시간 /.test(String(cls || '')) || isBreakSlot(cls); }
function isBreakSlot(cls) { return /^(일과전|방과후|점심|점심시간|청소|종례|등교|조회|아침|석식|야자)\s?[월화수목금]$/.test(String(cls || '')); }
function freeSlotLabel(cls) {
  const m = String(cls).match(/^빈시간 ([월화수목금])(\d)$/);
  if (m) return m[1] + '요일 ' + m[2] + '교시 (수업 없음)';
  const b = String(cls).match(/^(.+?)\s?([월화수목금])$/);
  if (b) return b[2] + '요일 ' + b[1];
  return '빈 시간';
}
// 그 날짜·교시의 전체 공유 안내
function sharedAt(date, period) {
  return records().filter(r => r.shared && r.date === date && String(r.period) === String(period));
}
function shareText(r) { return (r.memo || r.progress || '').split('\n')[0]; }

// 빈 칸에 남긴 메모의 첫 줄
function latestNote(cls) {
  const r = recordsFor(cls).find(x => x.memo || x.progress);
  if (!r) return '';
  const t = (r.memo || r.progress).split('\n')[0];
  return t.length > 14 ? t.slice(0, 14) + '…' : t;
}
function findRecord(cls, date, period) {
  return records().find(r => r.cls === cls && r.date === date && String(r.period) === String(period));
}
// 시간표에 표시된 주의 해당 요일(0=월) 날짜
function dayDate(dayIdx) {
  return addDays(shownWeek(), dayIdx);
}

/**
 * 칸을 눌렀을 때 뜨는 기록 창. 두 부분으로 나뉜다.
 *  · 내 메모   : 나만 보임 (진도 · 메모)
 *  · 전체 안내 : 모든 교직원에게 보임. 공지 권한자만 쓰고 고칠 수 있음
 * 둘은 따로 저장되므로 한쪽을 고쳐도 다른 쪽은 그대로다.
 * editId : 전체 안내 중 지금 고치고 있는 것 (없으면 내 것 또는 새 안내)
 */
function openClassModal(cls, date, period, editId) {
  if (cls === '전체') cls = '';                    // 예전 방식으로 불린 경우
  const canShare = !!(state.data.me && state.data.me.canPost);
  const free = isFreeSlot(cls);
  const mine = cls ? findRecord(cls, date, period) : null;
  const shared = sharedAt(date, period);
  const latest = cls && !free ? latestProgress(cls) : '';

  // 고칠 전체 안내 : 고르게 한 것 → 내가 쓴 것 → 없음(새로 쓰기)
  let editing = null;
  if (canShare) {
    if (editId) editing = shared.find(r => r.id === editId) || null;
    if (!editing && editId !== 'new') editing = shared.find(r => r.mine) || null;
  }
  const others = shared.filter(r => !editing || r.id !== editing.id);

  // 일과전·점심·방과후처럼 교시가 아닌 칸은 교시 선택 대신 고정 표시
  const fixedPeriod = !/^[1-7]$/.test(String(period));
  const slotName = fixedPeriod ? (String(cls).replace(/\s?[월화수목금]$/, '') || '시간') : '';
  let periodOpts = '';
  for (let p = 1; p <= 7; p++) {
    periodOpts += '<option value="' + p + '"' + (String(period) === String(p) ? ' selected' : '') + '>' + p + '교시</option>';
  }

  const title = !cls ? '전체 안내' : (free ? freeSlotLabel(cls) : cls);

  // ── 내 메모
  const mineHtml = !cls ? '' :
    '<form class="rec-sec" id="mForm" autocomplete="off">' +
      '<div class="rec-sec-head"><b>내 메모</b><span class="tag">나만 보임</span>' +
        (latest ? '<span class="grow"></span><span class="card-sub">현재 진도 : ' + esc(latest) + '</span>' : '') +
      '</div>' +
      (free ? '' :
        '<div class="form-row"><label for="mProg">진도</label><input class="input" id="mProg" maxlength="100" placeholder="예: Ⅱ-2 뉴턴 제2법칙 p.54" value="' + esc(mine ? mine.progress : '') + '"></div>') +
      '<div class="form-row"><label for="mMemo">메모</label><textarea class="input" id="mMemo" maxlength="2000" placeholder="' +
        (free ? '업무, 상담, 준비할 일 등' : '수업 내용, 과제, 다음 시간 준비물 등') + '">' + esc(mine ? mine.memo : '') + '</textarea></div>' +
      '<div class="form-err" id="mErr"></div>' +
      '<div class="rec-sec-actions">' +
        (mine ? '<button class="btn btn-danger" id="mDel" type="button">지우기</button>' : '') +
        '<span class="grow"></span>' +
        '<button class="btn btn-primary" id="mSave" type="submit">' + (mine ? '내 메모 저장' : '내 메모 기록') + '</button>' +
      '</div>' +
    '</form>';

  // ── 전체 안내 : 다른 안내 목록
  const othersHtml = others.map(r =>
    '<div class="share-box"><b>전체 안내</b> · ' + linkify(r.memo || r.progress || '') +
      '<div class="who">' + esc(r.author || '') +
        (canShare ? ' · <a href="#" class="share-edit" data-id="' + esc(r.id) + '">고치기</a>' : '') +
      '</div></div>').join('');

  // ── 전체 안내 : 쓰는 칸 (공지 권한자만)
  const sharedForm = !canShare ? '' :
    '<form id="sForm" autocomplete="off">' +
      '<div class="form-row"><label for="sMemo">' +
        (editing ? (editing.mine ? '내가 쓴 전체 안내' : esc(editing.author || '') + ' 선생님의 안내 고치기') : '새 전체 안내') +
      '</label><textarea class="input" id="sMemo" maxlength="2000" placeholder="예: 3교시 학년 전체 강당 집합">' +
        esc(editing ? (editing.memo || editing.progress || '') : '') + '</textarea></div>' +
      '<div class="form-err" id="sErr"></div>' +
      '<div class="rec-sec-actions">' +
        (editing ? '<button class="btn btn-danger" id="sDel" type="button">지우기</button>' : '') +
        (editing ? '<button class="btn" id="sNew" type="button">+ 새 안내</button>' : '') +
        '<span class="grow"></span>' +
        '<button class="btn btn-primary" id="sSave" type="submit">' + (editing ? '전체 안내 저장' : '전체 안내 올리기') + '</button>' +
      '</div>' +
    '</form>';

  const sharedHtml = (!canShare && !shared.length) ? '' :
    '<div class="rec-sec shared">' +
      '<div class="rec-sec-head"><b>전체 안내</b><span class="tag imp">모든 교직원에게 보임</span></div>' +
      othersHtml +
      sharedForm +
    '</div>';

  openModal(
    '<h2>' + esc(title) + '</h2>' +
    '<div class="form-2" style="margin-top:10px">' +
      '<div class="form-row"><label for="rDate">날짜</label><input class="input" type="date" id="rDate" value="' + esc(date) + '"></div>' +
      '<div class="form-row"><label for="rPeriod">교시</label>' +
        (fixedPeriod
          ? '<input class="input" value="' + esc(slotName) + '" disabled>' +
            '<input type="hidden" id="rPeriod" value="' + esc(period) + '">'
          : '<select class="input" id="rPeriod">' + periodOpts + '</select>') +
      '</div>' +
    '</div>' +
    mineHtml + sharedHtml +
    '<div class="modal-actions"><button class="btn" id="rClose" type="button">닫기</button></div>'
  );

  $('#rClose').onclick = closeModal;

  // 입력 칸 높이를 글 양에 맞춘다 (열 때 한 번, 글을 쓸 때마다)
  const fit = (ta) => {
    ta.style.height = 'auto';
    const max = Math.round(window.innerHeight * 0.4);
    ta.style.height = Math.min(ta.scrollHeight + 2, max) + 'px';
  };
  $('#modal').querySelectorAll('.rec-sec textarea').forEach(ta => {
    fit(ta);
    ta.addEventListener('input', () => fit(ta));
  });

  if ($('#mProg')) $('#mProg').focus(); else if ($('#mMemo')) $('#mMemo').focus(); else if ($('#sMemo')) $('#sMemo').focus();

  // 날짜·교시를 바꾸면 그 시간의 기록으로 창을 다시 연다
  const reload = () => {
    const nd = $('#rDate').value, np = $('#rPeriod').value;
    if (nd) openClassModal(cls || '전체', nd, np);
  };
  $('#rDate').addEventListener('change', reload);
  if (!fixedPeriod) $('#rPeriod').addEventListener('change', reload);

  const after = (j, msg) => {
    state.data.records = j.records;
    renderAll();
    toast(msg);
  };

  // 지우기 버튼 : 한 번 누르면 '정말 지우기'로 바뀌고 한 번 더 눌러야 지운다
  const twoStepDelete = (btn, id, done) => {
    btn.onclick = async () => {
      if (!btn.classList.contains('confirm')) {
        btn.classList.add('confirm');
        btn.textContent = '정말 지우기';
        return;
      }
      btn.disabled = true;
      try {
        const j = await api('deleteRecord', { key: state.key, id: id });
        after(j, '지웠습니다.');
        done();
      } catch (e) {
        handleActionError(e);
        btn.disabled = false;
      }
    };
  };

  // ── 내 메모 저장·지우기
  if ($('#mForm')) {
    if (mine) twoStepDelete($('#mDel'), mine.id, () => openClassModal(cls, date, period));

    $('#mForm').onsubmit = async (ev) => {
      ev.preventDefault();
      const rec = {
        id: mine ? mine.id : '',
        cls: cls,
        date: $('#rDate').value,
        period: $('#rPeriod').value,
        progress: $('#mProg') ? $('#mProg').value.trim() : (mine ? mine.progress : ''),
        memo: $('#mMemo').value.trim(),
        share: false
      };
      const err = $('#mErr');
      if (!rec.date) { err.textContent = '날짜를 입력해 주세요.'; return; }
      if (!rec.progress && !rec.memo && !mine) { err.textContent = free ? '메모를 입력해 주세요.' : '진도나 메모를 입력해 주세요.'; return; }
      err.textContent = '';
      const btn = $('#mSave');
      btn.disabled = true;
      btn.textContent = '저장 중…';
      try {
        const j = await api('saveRecord', { key: state.key, record: rec });
        after(j, j.message || '내 메모를 저장했습니다.');
        openClassModal(cls, rec.date, rec.period);
      } catch (e) {
        if (AUTH_ERRORS.indexOf(e.code) >= 0) { handleActionError(e); return; }
        err.textContent = e.message;
        btn.disabled = false;
        btn.textContent = mine ? '내 메모 저장' : '내 메모 기록';
      }
    };
  }

  // ── 전체 안내 고르기·저장·지우기
  $('#modal').querySelectorAll('.share-edit').forEach(a => {
    a.onclick = (ev) => { ev.preventDefault(); openClassModal(cls || '전체', date, period, a.dataset.id); };
  });
  if ($('#sNew')) $('#sNew').onclick = () => openClassModal(cls || '전체', date, period, 'new');

  if ($('#sForm')) {
    if (editing) twoStepDelete($('#sDel'), editing.id, () => openClassModal(cls || '전체', date, period));

    $('#sForm').onsubmit = async (ev) => {
      ev.preventDefault();
      const rec = {
        id: editing ? editing.id : '',
        cls: SHARED_CLS_NAME,
        date: $('#rDate').value,
        period: $('#rPeriod').value,
        progress: '',
        memo: $('#sMemo').value.trim(),
        share: true
      };
      const err = $('#sErr');
      if (!rec.date) { err.textContent = '날짜를 입력해 주세요.'; return; }
      if (!rec.memo) { err.textContent = editing ? '지우려면 지우기 버튼을 눌러 주세요.' : '안내 내용을 입력해 주세요.'; return; }
      err.textContent = '';
      const btn = $('#sSave');
      btn.disabled = true;
      btn.textContent = '저장 중…';
      try {
        const j = await api('saveRecord', { key: state.key, record: rec });
        after(j, '전체 안내를 저장했습니다.');
        openClassModal(cls || '전체', rec.date, rec.period);
      } catch (e) {
        if (AUTH_ERRORS.indexOf(e.code) >= 0) { handleActionError(e); return; }
        err.textContent = e.message;
        btn.disabled = false;
        btn.textContent = editing ? '전체 안내 저장' : '전체 안내 올리기';
      }
    };
  }
}
const SHARED_CLS_NAME = '전체';

function notices() { return state.data.notices || []; }

// 일정 보기: 전체 / 학교(전체 공개) / 내 일정(나만 보기) — 기기마다 기억
const NF_KEY = 'ssgh_notice_filter';
function noticeFilter() { try { return localStorage.getItem(NF_KEY) || 'all'; } catch (e) { return 'all'; } }
function setNoticeFilter(f) {
  try { localStorage.setItem(NF_KEY, f); } catch (e) {}
  renderUpcoming(); renderCalendar(); renderDayList();
}
function shownNotices() {
  const f = noticeFilter();
  return notices().filter(n => f === 'all' || (f === 'mine' ? n.private : !n.private));
}
function renderNoticeFilter() {
  const f = noticeFilter();
  document.querySelectorAll('#noticeFilter button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
}

function ddayInfo(n) {
  const today = todayStr();
  if (n.start <= today && n.end >= today) {
    return { text: n.start === n.end ? '오늘' : '진행 중', cls: 'on' };
  }
  const d = diffDays(today, n.start);
  return { text: 'D-' + d, cls: d <= 7 ? 'soon' : '' };
}

function noticeItemHtml(n, showDday) {
  const dd = ddayInfo(n);
  const today = todayStr();
  const past = n.end < today;
  return '<li class="notice-item' + (n.private ? ' mine' : '') + '" data-id="' + esc(n.id) + '">' +
    (showDday ? '<span class="dday ' + (past ? '' : dd.cls) + '">' + (past ? '지남' : dd.text) + '</span>' : '') +
    '<div class="notice-body">' +
      '<div class="notice-title">' +
        (n.private ? '<span class="tag mine" title="나에게만 보이는 일정">🔒 나만</span>' : '') +
        (n.important ? '<span class="tag imp">중요</span>' : '') +
        (n.category ? '<span class="tag">' + esc(n.category) + '</span>' : '') +
        '<span class="tt">' + esc(n.title) + '</span>' +
        (hasUrl(n.content) ? '<span class="link-mark" title="링크 포함">🔗</span>' : '') +
      '</div>' +
      '<div class="notice-meta">' + rangeText(n) + ' · ' + (n.private ? '나만 보기' : esc(n.author)) + '</div>' +
    '</div></li>';
}

function renderUpcoming() {
  const today = todayStr();
  renderNoticeFilter();
  const list = shownNotices()
    .filter(n => n.end >= today)
    .sort((a, b) => {
      const ao = a.start <= today ? 0 : 1;
      const bo = b.start <= today ? 0 : 1;
      if (ao !== bo) return ao - bo;
      if (a.start !== b.start) return a.start < b.start ? -1 : 1;
      if (a.important !== b.important) return a.important ? -1 : 1;
      return 0;
    })
    .slice(0, CONFIG.UPCOMING_MAX);

  $('#upcomingList').innerHTML = list.length
    ? list.map(n => noticeItemHtml(n, true)).join('')
    : '<li class="empty-msg">' + (noticeFilter() === 'mine' ? '예정된 내 일정이 없습니다. [+ 일정 등록]에서 "나만 보기"로 추가해 보세요.' : '예정된 일정이 없습니다.') + '</li>';
}

function renderCalendar() {
  const y = state.calYear, m = state.calMonth;
  $('#calMonth').textContent = y + '. ' + pad(m + 1);

  const first = new Date(y, m, 1);
  const startDate = new Date(y, m, 1 - first.getDay());
  const today = todayStr();
  const all = shownNotices();

  let html = DOW.map((w, i) => '<div class="cal-dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>').join('');

  for (let i = 0; i < 42; i++) {
    const d = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i);
    if (i === 35 && d.getMonth() !== m) break;
    const s = ymd(d);
    const dayNotices = all
      .filter(n => n.start <= s && n.end >= s)
      .sort((a, b) => (a.important === b.important ? 0 : a.important ? -1 : 1));
    const classes = ['cal-cell'];
    if (d.getMonth() !== m) classes.push('other');
    if (d.getDay() === 0) classes.push('sun');
    if (d.getDay() === 6) classes.push('sat');
    if (s === today) classes.push('today');
    if (s === state.selDate) classes.push('sel');

    html += '<div class="' + classes.join(' ') + '" data-date="' + s + '">' +
      '<span class="cal-num">' + d.getDate() + '</span>' +
      dayNotices.slice(0, 2).map(n => '<span class="chip' + (n.private ? ' mine' : n.important ? ' imp' : '') + '" title="' + (n.private ? '🔒 ' : '') + esc(n.title) + '">' + (n.private ? '🔒' : '') + esc(n.title) + '</span>').join('') +
      (dayNotices.length > 2 ? '<div class="chip-more">+' + (dayNotices.length - 2) + '</div>' : '') +
      '</div>';
  }
  $('#calGrid').innerHTML = html;
}

function renderDayList() {
  const s = state.selDate;
  const d = parseYmd(s);
  $('#dayTitle').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ') 일정';
  const list = shownNotices().filter(n => n.start <= s && n.end >= s);
  $('#dayList').innerHTML = list.length
    ? list.map(n => noticeItemHtml(n, false)).join('')
    : '<li class="empty-msg">등록된 일정이 없습니다.</li>';
}

/* ───────────── 모달 ───────────── */
function openModal(html) {
  $('#modal').innerHTML = html;
  $('#overlay').classList.remove('hidden');
}
function closeModal() {
  $('#overlay').classList.add('hidden');
  $('#modal').innerHTML = '';
}
function modalOpen() { return !$('#overlay').classList.contains('hidden'); }

function openDetail(id) {
  const n = notices().find(x => x.id === id);
  if (!n) return;
  const me = state.data.me;
  const canEdit = n.private || !!me.canPost;          // 개인 일정은 본인, 전체 일정은 공지 작성 권한이 있으면 누구 것이든 수정
  const mine = n.private || (canEdit && n.author === me.name);   // 삭제는 작성자만
  const dd = ddayInfo(n);
  const past = n.end < todayStr();

  openModal(
    '<div class="notice-title" style="margin-bottom:8px">' +
      '<span class="dday ' + (past ? '' : dd.cls) + '">' + (past ? '지남' : dd.text) + '</span>' +
      (n.private ? '<span class="tag mine">🔒 나만 보기</span>' : '') +
      (n.important ? '<span class="tag imp">중요</span>' : '') +
      (n.category ? '<span class="tag">' + esc(n.category) + '</span>' : '') +
    '</div>' +
    '<h2>' + esc(n.title) + '</h2>' +
    '<div class="meta">' + rangeText(n) + (n.private ? ' · 나에게만 보이는 일정' : ' · 작성 ' + esc(n.author)) + (n.createdAt ? ' · ' + esc(n.createdAt.slice(0, 16)) : '') + (n.editedBy ? ' · 수정 ' + esc(n.editedBy) : '') + '</div>' +
    '<div class="content">' + (n.content ? linkify(n.content) : '<span style="color:var(--faint)">내용 없음</span>') + '</div>' +
    '<div class="modal-actions">' +
      (canEdit ? '<div class="left"><button class="btn" id="mEdit" type="button">수정</button>' + (mine ? '<button class="btn btn-danger" id="mDel" type="button">삭제</button>' : '') + '</div>' : '') +
      '<button class="btn" id="mClose" type="button">닫기</button>' +
    '</div>'
  );

  $('#mClose').onclick = closeModal;
  if (canEdit) $('#mEdit').onclick = () => openForm(n);
  if (mine) {
    const del = $('#mDel');
    del.onclick = async () => {
      if (!del.classList.contains('confirm')) {
        del.classList.add('confirm');
        del.textContent = '정말 삭제';
        return;
      }
      del.disabled = true;
      try {
        const j = await api('deleteNotice', { key: state.key, id: n.id });
        state.data.notices = j.notices;
        closeModal();
        renderAll();
        toast('일정을 삭제했습니다.');
      } catch (e) {
        handleActionError(e);
        del.disabled = false;
      }
    };
  }
}

function openForm(n) {
  const editing = !!n;
  const me = state.data.me;
  const base = n || { start: state.selDate || todayStr(), end: state.selDate || todayStr(), category: '', title: '', content: '', important: false };
  // 공개 범위: 고칠 때는 지금 상태, 새로 쓸 때는 지난번 선택(처음엔 나만 보기). 권한이 없으면 나만 보기만
  let lastVis = 'private';
  try { lastVis = localStorage.getItem('ssgh_notice_vis') || 'private'; } catch (e) {}
  const othersPublic = editing && !n.private && n.author !== me.name;   // 남이 올린 전체 일정
  const canPublic = !!me.canPost;
  const canPrivate = !othersPublic;
  let vis = editing ? (n.private ? 'private' : 'public') : (canPublic ? lastVis : 'private');
  if (vis === 'public' && !canPublic) vis = 'private';
  if (vis === 'private' && !canPrivate) vis = 'public';
  const cats = CONFIG.CATEGORIES.slice();
  if (base.category && cats.indexOf(base.category) < 0) cats.unshift(base.category);

  openModal(
    '<h2>' + (editing ? '일정 수정' : '일정 등록') + '</h2>' +
    (othersPublic ? '<div class="meta">' + esc(n.author) + ' 선생님이 올린 일정입니다. 고친 사람은 기록에 남습니다.</div>' : '') +
    '<form id="nForm" autocomplete="off">' +
      '<div class="form-row"><label>누가 보나요</label><div class="vis-pick">' +
        '<label class="' + (canPublic ? '' : 'off') + '"><input type="radio" name="fVis" value="public"' + (vis === 'public' ? ' checked' : '') + (canPublic ? '' : ' disabled') + '>' +
          '<span>전체 일정<small>' + (canPublic ? '모든 교직원 화면에 보입니다' : '공지 작성 권한이 있어야 합니다') + '</small></span></label>' +
        '<label class="' + (canPrivate ? '' : 'off') + '"><input type="radio" name="fVis" value="private"' + (vis === 'private' ? ' checked' : '') + (canPrivate ? '' : ' disabled') + '>' +
          '<span>🔒 나만 보기<small>' + (canPrivate ? '내 화면에만 보입니다' : '다른 선생님이 올린 일정입니다') + '</small></span></label>' +
      '</div></div>' +
      '<div class="form-2">' +
        '<div class="form-row"><label for="fStart">시작일</label><input class="input" type="date" id="fStart" value="' + esc(base.start) + '" required></div>' +
        '<div class="form-row"><label for="fEnd">종료일</label><input class="input" type="date" id="fEnd" value="' + esc(base.end) + '" required></div>' +
      '</div>' +
      '<div class="form-row"><label for="fCat">분류</label><select class="input" id="fCat">' +
        cats.map(c => '<option' + (c === (base.category || '업무') ? ' selected' : '') + '>' + esc(c) + '</option>').join('') +
      '</select></div>' +
      '<div class="form-row"><label for="fTitle">제목</label><input class="input" id="fTitle" maxlength="100" value="' + esc(base.title) + '" required></div>' +
      '<div class="form-row"><label for="fContent">내용</label><textarea class="input" id="fContent" maxlength="2000">' + esc(base.content) + '</textarea></div>' +
      '<label class="check"><input type="checkbox" id="fImp"' + (base.important ? ' checked' : '') + '> 중요 표시</label>' +
      '<div class="form-err" id="fErr"></div>' +
      '<div class="modal-actions">' +
        '<button class="btn" id="fCancel" type="button">취소</button>' +
        '<button class="btn btn-primary" id="fSave" type="submit">' + (editing ? '저장' : '등록') + '</button>' +
      '</div>' +
    '</form>'
  );

  $('#fStart').addEventListener('change', () => {
    if ($('#fEnd').value < $('#fStart').value) $('#fEnd').value = $('#fStart').value;
  });
  $('#fCancel').onclick = () => (editing ? openDetail(n.id) : closeModal());
  $('#fTitle').focus();

  $('#nForm').onsubmit = async (ev) => {
    ev.preventDefault();
    const notice = {
      start: $('#fStart').value,
      end: $('#fEnd').value || $('#fStart').value,
      category: $('#fCat').value,
      title: $('#fTitle').value.trim(),
      content: $('#fContent').value.trim(),
      important: $('#fImp').checked,
      private: (document.querySelector('input[name=fVis]:checked') || {}).value === 'private'
    };
    const err = $('#fErr');
    if (!notice.start) { err.textContent = '시작일을 입력해 주세요.'; return; }
    if (notice.end < notice.start) { err.textContent = '종료일이 시작일보다 빠릅니다.'; return; }
    if (!notice.title) { err.textContent = '제목을 입력해 주세요.'; return; }
    err.textContent = '';

    const btn = $('#fSave');
    btn.disabled = true;
    btn.textContent = '저장 중…';
    try {
      let j;
      if (editing) {
        notice.id = n.id;
        j = await api('updateNotice', { key: state.key, notice: notice });
      } else {
        j = await api('addNotice', { key: state.key, notice: notice });
      }
      state.data.notices = j.notices;
      if (!editing) { try { localStorage.setItem('ssgh_notice_vis', notice.private ? 'private' : 'public'); } catch (e) {} }
      // 지금 보기에서 안 보이는 쪽으로 저장했으면 전체 보기로
      if ((noticeFilter() === 'mine' && !notice.private) || (noticeFilter() === 'school' && notice.private)) {
        try { localStorage.setItem(NF_KEY, 'all'); } catch (e) {}
      }
      closeModal();
      state.selDate = notice.start;
      const sd = parseYmd(notice.start);
      state.calYear = sd.getFullYear();
      state.calMonth = sd.getMonth();
      renderAll();
      toast((editing ? '일정을 수정했습니다.' : '일정을 등록했습니다.') + (notice.private ? ' (나만 보기)' : ''));
    } catch (e) {
      if (AUTH_ERRORS.indexOf(e.code) >= 0) { handleActionError(e); return; }
      err.textContent = e.message;
      btn.disabled = false;
      btn.textContent = editing ? '저장' : '등록';
    }
  };
}

function handleActionError(e) {
  if (AUTH_ERRORS.indexOf(e.code) >= 0) {
    storeClear();
    state.key = null;
    closeModal();
    showLogin(e.message, true);
  } else {
    toast(e.message, true);
  }
}

/* ───────────── 이벤트 ───────────── */
renderThemePick();
$('#themePick').addEventListener('click', (ev) => {
  const dot = ev.target.closest('.theme-dot');
  if (dot) setTheme(dot.dataset.theme);
});

$('#refreshBtn').onclick = () => refresh(false);
$('#miniRefresh').onclick = () => refresh(false);
$('#miniOnBtn').onclick = () => setMini(true);
$('#miniOffBtn').onclick = () => setMini(false);
$('#miniMemoSw').onclick = () => setMiniMemo(!miniMemoOn());
$('#installBtn').onclick = async () => {
  if (!installEvent) return;
  installEvent.prompt();
  try { await installEvent.userChoice; } catch (e) { }
  installEvent = null;
  $('#installBtn').classList.add('hidden');
};
$('#logoutBtn').onclick = logout;
$('#retryBtn').onclick = boot;
$('#addBtn').onclick = () => openForm(null);
$('#noticeFilter').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-f]');
  if (b) setNoticeFilter(b.dataset.f);
});

$('#calPrev').onclick = () => { state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; } renderCalendar(); };
$('#calNext').onclick = () => { state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; } renderCalendar(); };
$('#calToday').onclick = () => {
  const d = new Date();
  state.calYear = d.getFullYear(); state.calMonth = d.getMonth();
  state.selDate = todayStr();
  renderCalendar(); renderDayList();
};

$('#calGrid').addEventListener('click', (ev) => {
  const cell = ev.target.closest('.cal-cell');
  if (!cell) return;
  state.selDate = cell.dataset.date;
  const d = parseYmd(state.selDate);
  if (d.getMonth() !== state.calMonth) { state.calYear = d.getFullYear(); state.calMonth = d.getMonth(); }
  renderCalendar();
  renderDayList();
});

['#upcomingList', '#dayList'].forEach(sel => {
  $(sel).addEventListener('click', (ev) => {
    const item = ev.target.closest('.notice-item');
    if (item) openDetail(item.dataset.id);
  });
});

function moveWeek(step) {
  state.weekOffset = (state.weekOffset || 0) + step;
  if (state.weekOffset < -4) state.weekOffset = -4;
  if (state.weekOffset > 4) state.weekOffset = 4;
  renderWeek();
}
$('#tabs').addEventListener('click', (ev) => {
  const btn = ev.target.closest('.tab');
  if (btn) switchTab(btn.dataset.tab);
});
window.addEventListener('hashchange', () => {
  const name = (location.hash || '').replace('#', '');
  if (TABS.indexOf(name) >= 0 && name !== state.tab) switchTab(name, false);
});

$('#dutyPrev').onclick = () => moveDutyMonth(-1);
$('#dutyNext').onclick = () => moveDutyMonth(1);
$('#dutyThis').onclick = () => { state.dutyOffset = 0; renderDutyTable(); };

$('#attPrev').onclick = () => moveAttDay(-1);
$('#attNext').onclick = () => moveAttDay(1);
$('#attToday').onclick = () => { state.attOffset = 0; state.attSel = ''; loadAttend(); };
$('#attReload').onclick = () => attRefresh(true);
$('#attRangeBtn').onclick = () => { state.attRangeSel = ''; loadAttRange(); };
$('#attBody').addEventListener('change', (ev) => {
  if (ev.target.id === 'attRangeSess') { state.attRangeSess = ev.target.value; state.attRangeSel = ''; renderAttRange(); }
});
$('#attSearch').addEventListener('input', renderAttend);
$('#attOnlyMiss').addEventListener('change', renderAttend);
$('#attDate').addEventListener('change', (ev) => {
  const v = ev.target.value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  const off = diffDays(todayStr(), v);
  state.attOffset = Math.min(off, 7);
  state.attSel = '';
  loadAttend();
});
$('#attBody').addEventListener('click', (ev) => {
  if (ev.target.id === 'attBack') { loadAttend(); return; }
  if (ev.target.id === 'attCsv') { downloadAttCsv(); return; }
  const stu = ev.target.closest('tr[data-stu]');
  if (stu) {
    state.attRangeSel = state.attRangeSel === stu.dataset.stu ? '' : stu.dataset.stu;
    renderAttRange();
    return;
  }
  const box = ev.target.closest('.att-box');
  if (!box) return;
  state.attSel = box.dataset.sid;
  $('#attSearch').value = '';
  renderAttend();
});

$('#ttRefresh').onclick = async () => {
  const btn = $('#ttRefresh');
  if (btn.disabled) return;
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = '가져오는 중…';
  try {
    const r = await api('refreshTT', { key: state.key });
    if (r.data) { state.data = r.data; renderAll(); }
    toast('시간표를 새로 가져왔습니다. 변경 ' + (r.changed || 0) + '칸');
  } catch (e) {
    toast(e.message || '가져오지 못했습니다.', true);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
};

initMyLinks();
$('#weekPrev').onclick = () => moveWeek(-1);
$('#weekNext').onclick = () => moveWeek(1);
$('#weekThis').onclick = () => { state.weekOffset = 0; renderWeek(); };

$('#mealPrev').onclick = () => moveMeal(-1);
$('#mealNext').onclick = () => moveMeal(1);
$('#mealToday').onclick = () => {
  const dates = mealDates();
  const today = todayStr();
  state.mealDate = dates.indexOf(today) >= 0 ? today : (dates.find(d => d >= today) || dates[0]);
  renderMeal();
};

$('#weekTable').addEventListener('click', (ev) => {
  const chip = ev.target.closest('.share-chip');
  if (chip) {
    ev.stopPropagation();
    const cell = chip.closest('td.clickable');
    openClassModal(cell ? cell.dataset.cls : '전체', chip.dataset.date, chip.dataset.period, chip.dataset.rid);
    return;
  }
  const td = ev.target.closest('td.clickable');
  if (td) openClassModal(td.dataset.cls, dayDate(Number(td.dataset.day)), td.dataset.period);
});

$('#overlay').addEventListener('click', (ev) => { if (ev.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && modalOpen()) closeModal(); });

// 시계와 현재 교시 표시: 30초마다
let lastDay = todayStr();
setInterval(() => {
  if (state.view !== 'app' || !state.data) return;
  renderClock();
  renderToday();
  renderWeek();
  renderMini();
  const t = todayStr();
  if (t !== lastDay) { lastDay = t; state.selDate = t; renderAll(); refresh(true); }
}, 30 * 1000);

// 작은 화면의 아날로그 시계 : 1초마다
setInterval(() => {
  if (state.view === 'app' && isMini() && document.visibilityState === 'visible') drawMiniClock();
}, 1000);

// 자동 새로고침: 5분마다 (입력 창이 열려 있을 때는 건너뜀)
setInterval(() => {
  if (state.view === 'app' && !modalOpen() && document.visibilityState === 'visible') refresh(true);
}, CONFIG.REFRESH_MS);

// 다른 탭에 있다가 돌아오면 새로고침
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.view === 'app' && !modalOpen()) refresh(true);
});

boot();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGis()"></script>
</body>
</html>
