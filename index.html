<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3f6b52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="온라인 교무실">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>온라인 교무실</title>
<script>
  // 고른 색을 화면이 그려지기 전에 먼저 입힌다 (깜빡임 방지)
  (function () {
    try {
      var t = localStorage.getItem('ssgh_theme');
      if (t === 'blue' || t === 'lavender') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { }
    // 작은 화면 모드 : 주소에 ?mini=1 / ?mini=0 이 있으면 그것을, 없으면 이 기기에 기억된 값을 따른다
    try {
      var q = new URLSearchParams(location.search).get('mini');
      if (q === '1' || q === '0') localStorage.setItem('ssgh_mini', q);
      if (localStorage.getItem('ssgh_mini') === '1') document.documentElement.classList.add('mini');
    } catch (e) { }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── 색 : 크림·초록 (기본) ── */
  :root {
    --bg: #faf5ec;
    --card: #fffdf7;
    --line: #e4dac7;
    --line-soft: #efe7d8;
    --text: #2e2a24;
    --sub: #7a7264;
    --faint: #a89e8d;
    --accent: #3f6b52;
    --accent-hover: #355c46;
    --accent-soft: #e9efe7;
    --accent-text: #2f5741;
    --on-accent: #ffffff;
    --red: #b4532a;
    --red-soft: #f6e6dc;
    --green: #3f6b52;
    --green-soft: #e9efe7;
    --amber-soft: #f7edd9;
    --amber-line: #ddc79d;
    --warn-text: #8a5a28;

    --head-bg: rgba(250, 245, 236, .92);
    --head-bg-solid: #faf5ec;
    --head-text: #2e2a24;
    --head-sub: #7a7264;
    --head-btn-bg: #fffdf7;
    --head-btn-line: #e4dac7;
    --head-btn-text: #7a7264;
    --head-btn-hover: #efe7d8;
    --brand-bg: #3f6b52;
    --brand-fg: #ffffff;
    --nav-bg: rgba(250, 245, 236, .92);

    --today-bg: #e7eee3;
    --today-th-text: #fffdf7;
    --today-th-sub: #dbe6d6;
    --today-border: #c9d8c3;
    --today-faint: #6d7f68;
    --today-break: #dde7d8;
    --break-bg: #f7f1e5;
    --break-hover: #efe7d8;
    --duty-bg: #fdeee8;
    --duty-line: #f0cfc0;
    --duty-row: #fdf4f0;
    --chg-text: #9a5a2b;
    --chg-bg: #f5e3d4;
    --muted-num: #cdc3b2;
    --cell: #ffffff;
    --cell-hover: #f7f1e5;
    --cell-other: #f7f2e8;
    --modal-bg: #ffffff;
    --danger-line: #e3c3b0;
    --share-who: #8a5a3a;
    --toast-bg: #3a342b;
    --toast-text: #fdfaf4;

    --radius: 12px;
    --shadow: 0 1px 2px rgba(80, 60, 30, .04), 0 1px 3px rgba(80, 60, 30, .05);
    --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  }

  /* ── 색 : 라이온즈 블루 (파란 머리말 띠) ── */
  :root[data-theme="blue"] {
    --bg: #f3f6fa;
    --card: #ffffff;
    --line: #d5dfeb;
    --line-soft: #e8eef5;
    --text: #1d2733;
    --sub: #5d6b7c;
    --faint: #95a1b0;
    --accent: #0066b3;
    --accent-hover: #005799;
    --accent-soft: #e2eef9;
    --accent-text: #074ca1;
    --on-accent: #ffffff;
    --red: #c23b2e;
    --red-soft: #fbe7e4;
    --green: #2e7d4f;
    --green-soft: #e3f2e8;
    --amber-soft: #fbf1d8;
    --amber-line: #e6cf96;
    --warn-text: #85591c;

    --head-bg: rgba(7, 76, 161, .97);
    --head-bg-solid: #074ca1;
    --head-text: #ffffff;
    --head-sub: #c7dbf2;
    --head-btn-bg: rgba(255, 255, 255, .08);
    --head-btn-line: rgba(255, 255, 255, .35);
    --head-btn-text: #e8f1fb;
    --head-btn-hover: rgba(255, 255, 255, .18);
    --brand-bg: #ffffff;
    --brand-fg: #074ca1;
    --nav-bg: rgba(243, 246, 250, .95);

    --today-bg: #e4eef9;
    --today-th-text: #ffffff;
    --today-th-sub: #cfe2f5;
    --today-border: #b9d3ee;
    --today-faint: #5f7f9f;
    --today-break: #d6e6f6;
    --break-bg: #edf2f8;
    --break-hover: #e2eaf4;
    --duty-bg: #fdecea;
    --duty-line: #f2c9c4;
    --duty-row: #fdf3f2;
    --chg-text: #8a5a1c;
    --chg-bg: #f8e7c8;
    --muted-num: #b9c3cf;
    --cell: #ffffff;
    --cell-hover: #eef3f9;
    --cell-other: #f4f7fb;
    --modal-bg: #ffffff;
    --danger-line: #ecc3be;
    --share-who: #8a4a40;
    --toast-bg: #1d2733;
    --toast-text: #f3f6fa;

    --shadow: 0 1px 2px rgba(20, 40, 70, .05), 0 1px 3px rgba(20, 40, 70, .06);
  }

  /* ── 색 : 라벤더 ── */
  :root[data-theme="lavender"] {
    --bg: #f6f5fa;
    --card: #ffffff;
    --line: #dedbea;
    --line-soft: #ecebf3;
    --text: #26243a;
    --sub: #6b6880;
    --faint: #9d9ab0;
    --accent: #5b4b9a;
    --accent-hover: #4d3f86;
    --accent-soft: #ece9f6;
    --accent-text: #463a7c;
    --on-accent: #ffffff;
    --red: #b4532a;
    --red-soft: #f6e6dc;
    --green: #3f7a57;
    --green-soft: #e6f1ea;
    --amber-soft: #f7edd9;
    --amber-line: #ddc79d;
    --warn-text: #8a5a28;

    --head-bg: rgba(246, 245, 250, .92);
    --head-bg-solid: #f6f5fa;
    --head-text: #26243a;
    --head-sub: #6b6880;
    --head-btn-bg: #ffffff;
    --head-btn-line: #dedbea;
    --head-btn-text: #6b6880;
    --head-btn-hover: #ecebf3;
    --brand-bg: #5b4b9a;
    --brand-fg: #ffffff;
    --nav-bg: rgba(246, 245, 250, .92);

    --today-bg: #ebe8f5;
    --today-th-text: #ffffff;
    --today-th-sub: #d9d3ee;
    --today-border: #cdc6e6;
    --today-faint: #77709a;
    --today-break: #e2ddf1;
    --break-bg: #f1f0f7;
    --break-hover: #e6e4f0;
    --duty-bg: #fdeee8;
    --duty-line: #f0cfc0;
    --duty-row: #fdf4f0;
    --chg-text: #9a5a2b;
    --chg-bg: #f5e3d4;
    --muted-num: #c5c2d4;
    --cell: #ffffff;
    --cell-hover: #f1f0f7;
    --cell-other: #f4f3f9;
    --modal-bg: #ffffff;
    --danger-line: #e3c3b0;
    --share-who: #8a5a3a;
    --toast-bg: #2d2a40;
    --toast-text: #f6f5fa;

    --shadow: 0 1px 2px rgba(40, 30, 80, .04), 0 1px 3px rgba(40, 30, 80, .05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.6;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .card-title, .now-main, .brand-title { font-family: var(--serif); letter-spacing: -0.2px; }
  .clock, .today-list .t, table.week td.pcol, .dday, .cal-num, .rec-when {
    font-family: var(--serif);
  }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ── 로그인 ── */
  #loginView {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 40px 28px 32px;
    text-align: center;
  }
  .login-logo {
    width: 56px; height: 56px;
    margin: 0 auto 18px;
    border-radius: 16px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700;
  }
  .login-card h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: -0.3px; }
  .login-card p.desc { color: var(--sub); margin: 0 0 26px; font-size: 14px; }
  #gbtn { display: flex; justify-content: center; min-height: 44px; }
  #loginMsg { margin-top: 18px; font-size: 14px; color: var(--sub); min-height: 21px; }
  #loginMsg.error { color: var(--red); }
  .login-foot { margin-top: 22px; font-size: 12px; color: var(--faint); }
  .btn-retry { margin-top: 12px; }

  /* ── 상단 ── */
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: var(--head-bg);
    color: var(--head-text);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 12px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--brand-bg); color: var(--brand-fg);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; flex-shrink: 0;
  }
  .brand-text { min-width: 0; }
  .brand-title { font-weight: 700; font-size: 16px; letter-spacing: -0.2px; white-space: nowrap; }
  .brand-date { font-size: 13px; color: var(--head-sub); white-space: nowrap; }
  .top-spacer { flex: 1; }
  .clock { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
  .me { text-align: right; line-height: 1.3; }
  .me-name { font-weight: 600; font-size: 14px; }
  .me-dept { font-size: 12px; color: var(--head-sub); }
  .icon-btn {
    border: 1px solid var(--head-btn-line); background: var(--head-btn-bg); color: var(--head-btn-text);
    height: 34px; padding: 0 12px; border-radius: 9px; font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .icon-btn:hover { background: var(--head-btn-hover); color: var(--head-text); }

  /* 색 고르기 */
  .theme-pick { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  .theme-dot {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, .18); padding: 0; cursor: pointer;
  }
  .theme-dot:hover { transform: scale(1.12); }
  .theme-dot.on { box-shadow: 0 0 0 2px var(--head-bg-solid), 0 0 0 4px var(--head-text); }

  /* ── 작은 화면 모드 (위젯처럼 바탕화면 한쪽에 두는 창) ── */
  #miniView { display: none; }
  html.mini #appView > header.top,
  html.mini #appView > nav.tabs,
  html.mini #appView > main { display: none; }
  html.mini #miniView { display: block; }
  html.mini body { font-size: 14px; }
  .mini-bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: var(--head-bg); color: var(--head-text);
    border-bottom: 1px solid var(--line);
  }
  .mini-bar .brand-mark { width: 26px; height: 26px; font-size: 13px; border-radius: 7px; }
  .mini-bar .when { flex: 1; min-width: 0; line-height: 1.2; }
  .mini-bar .when b { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .mini-bar .when span { display: block; font-size: 12px; color: var(--head-sub); white-space: nowrap; }
  .mini-bar .icon-btn { height: 30px; padding: 0 9px; font-size: 12px; }
  .mini-body { padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .mini-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px;
  }
  .mini-card h4 { margin: 0 0 6px; font-size: 13px; color: var(--sub); font-weight: 700; display: flex; gap: 6px; align-items: baseline; }
  .mini-card h4 .cnt { font-weight: 400; color: var(--faint); font-size: 12px; }
  .mini-card h4 { align-items: center; }
  .mini-card h4 .grow { flex: 1; }
  .mini-card h4 .sw-lbl { font-size: 12px; font-weight: 400; color: var(--sub); }
  .mini-sw { position: relative; width: 30px; height: 17px; border-radius: 9px; border: none; padding: 0; flex-shrink: 0;
    background: var(--line); cursor: pointer; transition: background .15s; }
  .mini-sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.15); transition: left .15s; }
  .mini-sw.on { background: var(--accent); }
  .mini-sw.on::after { left: 15px; }
  .mini-card .today-list .mmemo { display: block; font-size: 11px; font-weight: 400; color: var(--sub);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .mini-card .today-list .mmemo::before { content: "✎ "; color: var(--faint); }
  .mini-card .now-box { margin-bottom: 0; padding: 10px 12px; }
  .mini-clock-row { display: flex; align-items: center; gap: 12px; }
  .mini-clock { flex-shrink: 0; width: 92px; display: flex; flex-direction: column; align-items: center; }
  .mini-clock svg { width: 88px; height: 88px; display: block; }
  .mini-digital { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .5px; margin-top: 2px; }
  .mini-now { flex: 1; min-width: 0; }
  .mini-now .now-box { height: 100%; }
  .ana-face { fill: var(--bg); stroke: var(--line); stroke-width: 2; }
  .ana-tick { stroke: var(--faint); stroke-width: 1; }
  .ana-tick.big { stroke: var(--text); stroke-width: 2.4; }
  .ana-h, .ana-m { stroke: var(--text); stroke-linecap: round; }
  .ana-h { stroke-width: 4.5; }
  .ana-m { stroke-width: 3; }
  .ana-s { stroke: var(--red); stroke-width: 1.2; stroke-linecap: round; }
  .ana-dot { fill: var(--red); }
  @media (max-width: 340px) {
    .mini-clock { width: 74px; }
    .mini-clock svg { width: 70px; height: 70px; }
    .mini-digital { font-size: 15px; }
  }
  .mini-card .now-main { font-size: 17px; }
  .mini-card .share-box { margin: 8px 0 0; padding: 7px 10px; font-size: 12px; }
  .mini-card .today-list li { grid-template-columns: 38px 76px 1fr; padding: 6px 2px; font-size: 13px; }
  .mini-card .today-list .duty { display: inline-block; margin-left: 4px; font-size: 11px; font-weight: 700; color: var(--red);
    background: var(--duty-bg); border: 1px solid var(--duty-line); border-radius: 5px; padding: 0 5px; }
  .mini-line { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
  .mini-line:first-of-type { border-top: none; }
  .mini-line .t { flex-shrink: 0; width: 86px; color: var(--sub); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
  .mini-line.duty-line .x { color: var(--red); font-weight: 700; }
  .mini-line.past { opacity: .5; }
  .mini-empty { color: var(--faint); font-size: 13px; }
  .mini-meal { font-size: 13px; line-height: 1.6; }

  /* ── 메뉴 ── */
  nav.tabs {
    position: sticky; top: 59px; z-index: 15;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--line);
    display: flex; gap: 4px;
    padding: 0 20px;
    max-width: 1280px; margin: 0 auto;
    overflow-x: auto;
  }
  nav.tabs .tab {
    border: none; background: none; color: var(--sub);
    font-family: var(--serif); font-size: 15px; font-weight: 500;
    padding: 12px 14px 10px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav.tabs .tab:hover { color: var(--text); }
  nav.tabs .tab.on { color: var(--accent-text); font-weight: 700; border-bottom-color: var(--accent); }

  /* ── 본문 ── */
  main {
    max-width: 1280px; margin: 0 auto;
    padding: 20px;
  }
  .panel {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    gap: 20px;
    align-items: start;
  }
  /* 일정 화면: 목록은 좁게, 달력은 넓게 */
  .panel[data-panel="notice"] { grid-template-columns: minmax(280px, 0.62fr) minmax(0, 1.38fr); }
  .panel[data-panel="notice"] .cal-cell { min-height: 96px; }
  .panel[data-panel="notice"] .chip { font-size: 12px; padding: 2px 6px; }
  .panel .col.wide { grid-column: 1 / -1; }
  .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    min-width: 0;
  }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .card-title { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.2px; }
  .card-sub { font-size: 13px; color: var(--sub); }
  .card-head .grow { flex: 1; }

  .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    height: 34px; padding: 0 14px; border-radius: 9px; font-size: 13px; font-weight: 500;
  }
  .btn:hover { background: var(--line-soft); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { color: var(--red); border-color: var(--danger-line); }
  .btn-danger:hover { background: var(--red-soft); }
  .btn-danger.confirm { background: var(--red); color: #fff; border-color: var(--red); }
  .btn:disabled { opacity: .55; cursor: default; }

  /* 오늘 상태 */
  .now-box {
    border-radius: 12px;
    background: var(--accent-soft);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .now-label { font-size: 12px; color: var(--accent-text); font-weight: 600; }
  .now-main { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; margin-top: 2px; }
  .now-desc { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .now-box.free { background: var(--line-soft); }
  .now-box.free .now-label { color: var(--sub); }

  .today-list { list-style: none; margin: 0; padding: 0; }
  .today-list li {
    display: grid;
    grid-template-columns: 52px 92px 1fr;
    align-items: center;
    padding: 9px 4px;
    border-top: 1px solid var(--line-soft);
    font-size: 14px;
  }
  .today-list li:first-child { border-top: none; }
  .today-list .p { font-weight: 600; color: var(--sub); }
  .today-list .t { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
  .today-list .c { font-weight: 500; }
  .today-list .c.empty { color: var(--faint); font-weight: 400; }
  .today-list li.done .c, .today-list li.done .p { color: var(--faint); }
  .today-list li.now {
    background: var(--accent-soft);
    border-radius: 9px;
    border-top-color: transparent;
  }
  .today-list li.now + li { border-top-color: transparent; }
  .today-list li.now .p, .today-list li.now .c { color: var(--accent-text); }
  .today-list li.clickable { cursor: pointer; }
  .today-list li.clickable:hover { background: var(--line-soft); border-radius: 9px; }
  .today-list .c .prog { display: block; font-size: 12px; color: var(--sub); font-weight: 400; margin-top: 1px; }
  .today-list .c .rec-done { color: var(--green); font-size: 12px; margin-left: 4px; }
  .tt-note { font-size: 12px; color: var(--faint); margin-top: 10px; }
  .tt-warn { background: var(--amber-soft); border-radius: 9px; padding: 10px 12px; font-size: 13px; color: var(--warn-text); margin-bottom: 12px; }
  .legend { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--sub); }
  .legend .box { width: 11px; height: 11px; border-radius: 3px; background: var(--amber-soft); border: 1px solid var(--amber-line); display: inline-block; }

  /* 주간 시간표 */
  .week-wrap { overflow-x: auto; }
  table.week { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 440px; table-layout: fixed; }
  table.week th, table.week td {
    border-bottom: 1px solid var(--line-soft);
    border-right: 1px solid var(--line-soft);
    padding: 8px 4px;
    text-align: center;
    font-size: 13px;
  }
  table.week th:last-child, table.week td:last-child { border-right: none; }
  table.week th.pcol, table.week td.pcol { border-right: 1px solid var(--line); }
  table.week td.cls.empty-cell { cursor: pointer; }
  table.week td.cls.empty-cell:hover { background: var(--line-soft); }
  table.week td .share-chip {
    display: block; font-size: 11px; margin-top: 3px;
    background: var(--red-soft); color: var(--red);
    border-radius: 5px; padding: 1px 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
  }
  .share-box {
    background: var(--red-soft); color: var(--red);
    border-radius: 9px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px;
  }
  .share-box b { font-weight: 700; }
  .share-box .who { color: var(--share-who); font-size: 12px; }
  table.week td .note-mark { display: block; font-size: 11px; color: var(--faint); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.week th { color: var(--sub); font-weight: 600; font-size: 12px; }
  table.week th.pcol { width: 92px; }
  table.week td.pcol { color: var(--sub); font-weight: 600; text-align: right; padding-right: 10px; line-height: 1.3; white-space: nowrap; }
  table.week td.pcol .ptime { display: block; font-size: 11px; color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
  table.week tr.nowrow td.pcol { color: var(--accent-text); }
  table.week td.cls { word-break: keep-all; }
  table.week td.cls.filled { color: var(--text); font-weight: 500; }
  table.week .today { background: var(--today-bg); }
  table.week th.today {
    color: var(--today-th-text); background: var(--accent);
    border-radius: 8px 8px 0 0; font-weight: 700;
  }
  table.week th.today span { color: var(--today-th-sub) !important; }
  table.week td.today {
    font-weight: 700; color: var(--accent-text);
    border-left: 1px solid var(--today-border); border-right: 1px solid var(--today-border);
  }
  table.week td.today.cls.filled { font-size: 14px; }
  table.week td.today .wprog, table.week td.today .note-mark { color: var(--today-faint); }
  table.week tr.breakrow td.today { background: var(--today-break); }
  table.week tr:last-child td.today { border-radius: 0 0 8px 8px; }
  table.week td.done { opacity: .55; }
  table.week tr.breakrow td {
    background: var(--break-bg); color: var(--sub); font-size: 12px;
    text-align: center; letter-spacing: 1px; padding: 6px 4px;
  }
  table.week tr.breakrow.nowbreak td { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  table.week tr.breakrow td.pcol { letter-spacing: 0; }
  table.week tr.breakrow td.breakcell { letter-spacing: 0; padding: 5px 4px; }
  table.week tr.breakrow td.breakcell:hover { background: var(--break-hover); }
  table.week td.filled .duty, table.week td.empty-cell .duty { margin-top: 3px; font-size: 11px; }
  table.week td .duty { display: inline-block; font-size: 12px; font-weight: 700; color: var(--red);
    background: var(--duty-bg); border: 1px solid var(--duty-line); border-radius: 6px; padding: 1px 6px; margin: 1px 0; }
  table.week tr.breakrow td.cls:has(.duty) { background: var(--duty-row); }
  table.week td.nowcell { background: var(--accent-soft); color: var(--accent-text); border-radius: 6px; font-weight: 700; }
  table.week td.clickable { cursor: pointer; }
  table.week td.clickable:hover { background: var(--line-soft); }
  table.week td.changed { background: var(--amber-soft); }
  table.week td .wprog { display: block; font-size: 11px; color: var(--faint); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.week td .chg {
    font-size: 10px; color: var(--chg-text); background: var(--chg-bg);
    border-radius: 4px; padding: 0 3px; margin-left: 4px; vertical-align: 1px;
  }
  table.week tr:last-child td { border-bottom: none; }

  /* 바로가기 */
  .link-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .link-group {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px 16px; min-width: 0;
  }
  .link-group-title {
    font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--accent-text);
    padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: baseline; gap: 6px;
  }
  .link-group-title .cnt { font-size: 12px; font-weight: 400; color: var(--faint); }
  .link-row { display: flex; flex-direction: column; gap: 2px; }
  .link-note { font-size: 12px; color: var(--faint); margin-left: 4px; }
  @media (max-width: 1100px) { .link-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 700px) { .link-grid { grid-template-columns: minmax(0, 1fr); } }
  .link-btn {
    display: flex; align-items: baseline; gap: 7px;
    border: none; background: none; color: var(--text);
    border-radius: 8px; padding: 7px 8px; font-size: 14px; text-decoration: none;
  }
  .link-btn:hover { background: var(--accent-soft); color: var(--accent-text); }
  .link-btn .ico { color: var(--faint); font-size: 12px; }
  .link-btn:hover .ico { color: var(--accent); }

  /* 내 바로가기 (시간표 위, 이 브라우저에만 저장) */
  .myl { margin-bottom: 14px; }
  .myl-bar { display: flex; align-items: center; gap: 10px; }
  .myl-label { font-size: 13px; font-weight: 700; color: var(--sub); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .myl-list { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: thin; }
  .myl-tile {
    position: relative; flex: none; display: flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 12px 0 6px; max-width: 200px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--card); box-shadow: var(--shadow);
    color: var(--text); text-decoration: none; font-size: 14px; white-space: nowrap;
  }
  a.myl-tile:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
  .myl-ico { width: 28px; height: 28px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 13px; }
  .myl-name { overflow: hidden; text-overflow: ellipsis; }
  .myl-empty { border-style: dashed; color: var(--sub); background: none; box-shadow: none; padding: 0 14px; cursor: pointer; }
  .myl-empty:hover { color: var(--accent-text); border-color: var(--accent); }
  .myl-btn { flex: none; width: 34px; height: 34px; padding: 0; font-size: 16px; }
  .myl.editing .myl-tile { cursor: grab; padding-right: 58px; }
  .myl.editing .myl-list { flex-wrap: wrap; overflow: visible; }   /* 편집할 때는 모두 펼쳐서 끌기 쉽게 */
  .myl.editing .myl-tile.drag { opacity: .4; }
  .myl.editing .myl-tile.over { border-color: var(--accent); }
  .myl-tools { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; }
  .myl-tools button { width: 23px; height: 23px; padding: 0; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--sub); font-size: 11px; cursor: pointer; }
  .myl-tools button.del { color: var(--red); }
  .myl-form { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 10px; align-items: end; }
  .myl-form label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .myl-form .err { grid-column: 1 / -1; color: var(--red); font-size: 12px; min-height: 0; }
  .myl-foot { margin-top: 8px; font-size: 12px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .myl-foot button { border: none; background: none; padding: 0; color: var(--sub); text-decoration: underline; font-size: 12px; cursor: pointer; }
  @media (max-width: 700px) { .myl-form { grid-template-columns: minmax(0, 1fr); } }
  .link-btn { position: relative; }
  .link-star { margin-left: auto; align-self: center; border: none; background: none; padding: 0 2px; font-size: 15px;
    color: var(--faint); cursor: pointer; opacity: 0; }
  .link-btn:hover .link-star, .link-star.on { opacity: 1; }
  .link-star.on { color: #d9a400; }
  @media (hover: none) { .link-star { opacity: .7; } }

  /* 급식 */
  .meal-tabs { display: flex; gap: 4px; }
  .meal-tab {
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    width: 30px; height: 28px; border-radius: 8px; font-size: 13px; padding: 0;
  }
  .meal-tab:hover { background: var(--line-soft); }
  .meal-tab.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .meal-tab.none { color: var(--muted-num); }
  .meal-date { font-size: 13px; color: var(--sub); margin-bottom: 8px; }
  .meal-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; }
  .meal-list li {
    background: var(--line-soft); border-radius: 8px;
    padding: 5px 10px; font-size: 14px;
  }
  .meal-list li.main { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }

  /* 공지 목록 */
  .notice-list { list-style: none; margin: 0; padding: 0; }
  .notice-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 11px 6px;
    border-top: 1px solid var(--line-soft);
    cursor: pointer;
    border-radius: 8px;
  }
  .notice-item:first-child { border-top: none; }
  .notice-item:hover { background: var(--line-soft); }
  .dday {
    flex-shrink: 0;
    min-width: 58px;
    text-align: center;
    font-size: 12px; font-weight: 700;
    padding: 4px 6px;
    border-radius: 7px;
    background: var(--line-soft);
    color: var(--sub);
    font-variant-numeric: tabular-nums;
  }
  .dday.soon { background: var(--accent-soft); color: var(--accent-text); }
  .dday.on { background: var(--green-soft); color: var(--green); }
  .notice-body { min-width: 0; flex: 1; }
  .notice-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .notice-title .tt { overflow: hidden; text-overflow: ellipsis; }
  .notice-meta { font-size: 12px; color: var(--faint); margin-top: 1px; }
  .tag {
    display: inline-block;
    font-size: 11px; font-weight: 600;
    padding: 1px 7px; border-radius: 999px;
    background: var(--line-soft); color: var(--sub);
    white-space: nowrap;
  }
  .tag.imp { background: var(--red-soft); color: var(--red); }
  .empty-msg { color: var(--faint); font-size: 14px; padding: 14px 4px; text-align: center; }

  /* 달력 */
  .cal-nav { display: flex; align-items: center; gap: 6px; }
  .cal-nav .month { font-weight: 700; font-size: 15px; min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal-dow { text-align: center; font-size: 12px; color: var(--sub); font-weight: 600; padding: 2px 0 6px; }
  .cal-dow.sun { color: var(--red); }
  .cal-dow.sat { color: var(--accent); }
  .cal-cell {
    min-height: 78px;
    border: 1px solid var(--line-soft);
    border-radius: 9px;
    padding: 4px 5px;
    cursor: pointer;
    background: var(--cell);
    min-width: 0;
    overflow: hidden;
  }
  .cal-cell:hover { border-color: var(--line); background: var(--cell-hover); }
  .cal-cell.other { background: var(--cell-other); }
  .cal-cell.other .cal-num { color: var(--muted-num); }
  .cal-cell.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .cal-num { font-size: 12px; font-weight: 600; color: var(--sub); font-variant-numeric: tabular-nums; }
  .cal-cell.sun .cal-num { color: var(--red); }
  .cal-cell.sat .cal-num { color: var(--accent); }
  .cal-cell.today .cal-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 21px; height: 21px; border-radius: 50%;
    background: var(--accent); color: var(--on-accent);
  }
  .chip {
    display: block;
    font-size: 11px;
    line-height: 1.35;
    padding: 1px 5px;
    margin-top: 2px;
    border-radius: 5px;
    background: var(--accent-soft);
    color: var(--accent-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip.imp { background: var(--red-soft); color: var(--red); }
  .chip.mine { background: transparent; color: var(--sub); border: 1px dashed var(--faint); padding: 0 4px; }
  .tag.mine { background: transparent; border: 1px dashed var(--faint); color: var(--sub); }
  .notice-item.mine .notice-title .tt { color: var(--sub); }
  .nf-seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin: 2px 0 8px; }
  .nf-seg button { flex: 1; border: none; background: var(--card); color: var(--sub); height: 32px; padding: 0 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .nf-seg button + button { border-left: 1px solid var(--line); }
  .nf-seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .vis-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vis-pick label { display: flex; align-items: flex-start; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text); margin: 0; }
  .vis-pick label small { display: block; font-weight: 400; font-size: 12px; color: var(--faint); margin-top: 2px; }
  .vis-pick input { margin-top: 3px; accent-color: var(--accent); }
  .vis-pick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .vis-pick label.off { opacity: .5; cursor: not-allowed; }
  .chip-more { font-size: 11px; color: var(--faint); margin-top: 1px; padding-left: 4px; }
  .day-panel { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .day-panel-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }

  /* 모달 */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(17, 24, 39, .35);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal {
    width: 100%; max-width: 520px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: var(--modal-bg);
    color: var(--text);
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .18);
    padding: 22px 22px 18px;
  }
  .modal h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.3px; }
  .modal .meta { font-size: 13px; color: var(--sub); margin-bottom: 14px; }
  .modal .content { white-space: pre-wrap; word-break: break-word; font-size: 15px; background: var(--line-soft); border-radius: 10px; padding: 12px 14px; min-height: 48px; }
  .modal .content a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
  .modal .content a:hover { color: var(--accent); }
  .modal .content a::before { content: "🔗 "; text-decoration: none; display: inline-block; margin-right: 2px; }
  .link-mark { font-size: 12px; color: var(--faint); font-weight: 400; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .modal-actions .left { margin-right: auto; display: flex; gap: 8px; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 5px; }
  .form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 11px;
    background: var(--card);
    outline: none;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea.input { min-height: 120px; resize: vertical; }
  .check { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--red); }
  .form-err { color: var(--red); font-size: 13px; min-height: 19px; margin-top: 4px; }
  /* 근무표 : 표 안에서 스크롤하고 첫 행(근무 종류)은 위에 고정 */
  .duty-wrap {
    overflow: auto;
    max-height: calc(100vh - 230px);
    min-height: 240px;
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }
  table.dutytable { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
  table.dutytable th, table.dutytable td {
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 7px 8px; text-align: center;
    vertical-align: middle; }
  table.dutytable thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--accent-soft); font-weight: 700; white-space: nowrap;
    box-shadow: 0 1px 0 var(--line), 0 3px 4px rgba(0, 0, 0, .06);
  }
  table.dutytable thead th .dt-time { display: block; font-size: 11px; font-weight: 500; color: var(--sub); }
  table.dutytable td.dcol { white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.dutytable tr.weekend td.dcol { color: var(--red); }
  table.dutytable tr.today { background: var(--accent-soft); }
  table.dutytable td .who { display: block; line-height: 1.5; }
  table.dutytable td .who.me { color: var(--red); font-weight: 700; text-align: center; line-height: 1.5; }
  table.dutytable td .pl { font-size: 11px; color: var(--sub); }
  .duty-pop { list-style: none; margin: 14px 0 4px; padding: 0; }
  .duty-pop li { display: flex; gap: 12px; align-items: baseline; padding: 10px 12px; border-radius: 10px;
    background: var(--accent-soft); margin-bottom: 8px; }
  .duty-pop li.past { background: var(--line-soft); color: var(--sub); }
  .duty-pop .dp-time { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }

  /* 학생출결 */
  .att-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .att-range { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  .att-rangebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .att-rangebar .grow { flex: 1; }
  table.atttable tr.pick { cursor: pointer; }
  table.atttable tr.pick:hover td { background: var(--line-soft); }
  table.atttable tr.pick.on td { background: var(--accent-soft); font-weight: 700; }
  .att-detail-title { margin: 16px 0 8px; font-weight: 700; }
  .att-tools .input { max-width: 220px; }
  .att-date { font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text); font-family: inherit; }
  .att-sum { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .att-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--card);
    cursor: pointer; text-align: left; font: inherit; color: var(--text); }
  .att-box:hover { background: var(--line-soft); }
  .att-box.live { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .att-box.sel { background: var(--accent-soft); }
  /* 타임명이 같은 카드는 같은 색 */
  .att-box.grp { background: var(--gt); border-left: 6px solid var(--g); }
  .att-box.grp:hover { filter: brightness(.97); }
  .att-box.grp.sel { outline: 3px solid var(--g); outline-offset: 1px; }

<script>
/* ───────────── 설정 ───────────── */
const CONFIG = {
  CLIENT_ID: '226042142319-su9mftc5alsq8kg8euclg6tehp5s5iit.apps.googleusercontent.com',
  GAS_URL: 'https://script.google.com/macros/s/AKfycbysDxn0lj_bOdqbeLjmi6v4gQEJkch9kEvhUS9wEZWJlwbZ7jF6llg93qdadz0v6gwpBQ/exec',
  REFRESH_MS: 5 * 60 * 1000,
  UPCOMING_MAX: 8,
  CATEGORIES: ['학사', '행사', '회의', '업무', '연수', '기타']
};
const STORE_KEY = 'ssgh_dash_key';
const DAYS = ['월', '화', '수', '목', '금'];
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const AUTH_ERRORS = ['NO_KEY', 'INVALID_KEY', 'KEY_EXPIRED', 'NOT_ALLOWED'];

const state = {
  key: null,
  data: null,
  calYear: 0,
  calMonth: 0,
  selDate: '',
  view: 'loading',
  weekOffset: 0,
  gisReady: false,
  busy: false
};

/* ───────────── 도구 ───────────── */
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

// 글 속의 http/https 주소를 새 탭에서 열리는 링크로 바꿈 (먼저 HTML 이스케이프 후 처리)
const URL_RE = /https?:\/\/[^\s<>"']+/g;
function hasUrl(text) { URL_RE.lastIndex = 0; return URL_RE.test(String(text || '')); }
function linkify(text) {
  return esc(text).replace(/https?:\/\/[^\s<>"']+/g, (raw) => {
    let url = raw;
    let tail = '';
    // 문장 끝 문장부호는 링크에서 제외
    while (/[.,;:!?)\]}]$/.test(url)) { tail = url.slice(-1) + tail; url = url.slice(0, -1); }
    const plain = url.replace(/&amp;/g, '&');
    const shown = plain.length > 70 ? plain.slice(0, 45) + '…' + plain.slice(-18) : plain;
    return '<a href="' + url + '" target="_blank" rel="noopener" title="' + url + '">' + esc(shown) + '</a>' + tail;
  });
}

function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function diffDays(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function todayStr() { return ymd(new Date()); }
function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function toMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function shortDate(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '.' + d.getDate() + '(' + DOW[d.getDay()] + ')'; }
function rangeText(n) { return n.start === n.end ? shortDate(n.start) : shortDate(n.start) + ' ~ ' + shortDate(n.end); }

function storeGet() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; } }
function storeSet(v) { try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e) {} }
function storeClear() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

let toastTimer = null;
function toast(msg, isError) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = isError ? 'error' : '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2800);
}

/* ───────────── 화면 색 (기기마다 따로 기억) ───────────── */
const THEME_KEY = 'ssgh_theme';
// 동그라미는 실제 화면처럼 두 색으로 나눠 보여 준다 : [강조·머리말 색, 바탕 색]
const THEMES = [
  { id: 'cream',    name: '크림·초록',     dot: ['#3f6b52', '#faf5ec'] },
  { id: 'blue',     name: '라이온즈 블루', dot: ['#074ca1', '#f3f6fa'] },
  { id: 'lavender', name: '라벤더',        dot: ['#5b4b9a', '#f6f5fa'] }
];

function currentTheme() {
  const t = document.documentElement.getAttribute('data-theme');
  return THEMES.some(x => x.id === t) ? t : 'cream';
}

function setTheme(id) {
  if (!THEMES.some(x => x.id === id)) id = 'cream';
  if (id === 'cream') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', id);
  try { localStorage.setItem(THEME_KEY, id); } catch (e) { }
  renderThemePick();
}

function renderThemePick() {
  const cur = currentTheme();
  $('#themePick').innerHTML = THEMES.map(t =>
    '<button class="theme-dot' + (t.id === cur ? ' on' : '') + '" type="button"' +
    ' data-theme="' + t.id + '" title="' + t.name + '" aria-label="' + t.name + ' 색으로 바꾸기"' +
    ' aria-pressed="' + (t.id === cur) + '"' +
    ' style="background:linear-gradient(135deg,' + t.dot[0] + ' 50%,' + t.dot[1] + ' 50%)"></button>').join('');
}

/* ───────────── 서버 통신 ───────────── */
async function api(action, payload) {
  const body = Object.assign({ action: action }, payload || {});
  let res;
  try {
    res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
  } catch (e) {
    const err = new Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');
    err.code = 'NETWORK';
    throw err;
  }
  let json;
  try { json = await res.json(); } catch (e) {
    const err = new Error('서버 응답을 읽을 수 없습니다.');
    err.code = 'BAD_RESPONSE';
    throw err;
  }
  if (!json.ok) {
    const err = new Error(json.message || '오류가 발생했습니다.');
    err.code = json.error;
    throw err;
  }
  return json;
}

function showView(name) {
  state.view = name;
  $('#loginView').classList.toggle('hidden', name !== 'login');
  $('#loadingView').classList.toggle('hidden', name !== 'loading');
  $('#appView').classList.toggle('hidden', name !== 'app');
}

function showLogin(msg, isError, canRetry) {
  showView('login');
  setLoginMsg(msg || '', isError);
  $('#retryBtn').classList.toggle('hidden', !canRetry);
  renderLoginButton();
}

function setLoginMsg(msg, isError) {
  const el = $('#loginMsg');
  el.textContent = msg;

}

/* ───────────── 구글 로그인 ───────────── */
function initGis() {
  if (!(window.google && google.accounts && google.accounts.id)) return;
  google.accounts.id.initialize({
    client_id: CONFIG.CLIENT_ID,
    callback: onCredential,
    auto_select: true,
    cancel_on_tap_outside: false,
    itp_support: true,
    use_fedcm_for_prompt: true
  });
  state.gisReady = true;
  if (state.view === 'login') renderLoginButton();
}

function renderLoginButton() {
  if (!state.gisReady) return;
  const box = $('#gbtn');
  box.innerHTML = '';
  google.accounts.id.renderButton(box, {
    theme: 'outline', size: 'large', text: 'signin_with',
    shape: 'pill', locale: 'ko', width: 260
  });
  google.accounts.id.prompt();
}

async function onCredential(resp) {
  if (!resp || !resp.credential) return;
  setLoginMsg('계정을 확인하고 있습니다…');
  $('#retryBtn').classList.add('hidden');
  try {
    const j = await api('login', { idToken: resp.credential });
    state.key = j.key;
    storeSet({ key: j.key, expires: j.keyExpires });
    state.data = j;
    enterApp();
  } catch (e) {
    setLoginMsg(e.message, true);
  }
}

/* ───────────── 시작 ───────────── */
async function boot() {
  const saved = storeGet();
  if (!saved || !saved.key) { showLogin(); return; }
  state.key = saved.key;
  showView('loading');
  try {
    state.data = await api('data', { key: state.key });
    enterApp();
  } catch (e) {
    if (AUTH_ERRORS.indexOf(e.code) >= 0) {
      storeClear();
      state.key = null;
      showLogin(e.message, true);
    } else {
      showLogin(e.message, true, true);
    }
  }
}

function enterApp() {
  initTab();
  const now = new Date();
  if (!state.selDate) state.selDate = todayStr();
  if (!state.calYear) { state.calYear = now.getFullYear(); state.calMonth = now.getMonth(); }
  showView('app');
  renderAll();
  maybeDutyPopup();
}

async function refresh(silent) {
  if (!state.key || state.busy) return;
  state.busy = true;
  try {
    state.data = await api('data', { key: state.key });
    renderAll();
    refreshDutyTab();
    if (state.tab === 'attend') attRefresh(true);
    if (!silent) toast('최신 내용으로 새로고침했습니다.');
  } catch (e) {
    if (AUTH_ERRORS.indexOf(e.code) >= 0) {
      storeClear();
      state.key = null;
      closeModal();
      showLogin(e.message, true);
    } else if (!silent) {
      toast(e.message, true);
    }
  } finally {
    state.busy = false;
  }
}

async function logout() {
  const key = state.key;
  storeClear();
  state.key = null;
  state.data = null;
  if (state.gisReady) google.accounts.id.disableAutoSelect();
  api('logout', { key: key }).catch(() => {});
  showView('login');
  setLoginMsg('로그아웃되었습니다.');
  $('#retryBtn').classList.add('hidden');
  if (state.gisReady) {
    const box = $('#gbtn');
    box.innerHTML = '';
    google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'ko', width: 260 });
  }
}

// 아날로그 시계 : 눈금은 한 번만 그리고, 바늘은 1초마다 돌린다
let miniClockBuilt = false;
function drawMiniClock() {
  const svg = $('#miniAna');
  if (!svg) return;
  const NS = 'http://www.w3.org/2000/svg';
  if (!miniClockBuilt) {
    const mk = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
    svg.appendChild(mk('circle', { cx: 50, cy: 50, r: 46, class: 'ana-face' }));
    for (let i = 0; i < 60; i++) {
      const big = i % 5 === 0;
      const a = (i * 6 - 90) * Math.PI / 180;
      const r1 = 43, r2 = big ? 37 : 40.5;
      svg.appendChild(mk('line', {
        x1: 50 + r1 * Math.cos(a), y1: 50 + r1 * Math.sin(a),
        x2: 50 + r2 * Math.cos(a), y2: 50 + r2 * Math.sin(a),
        class: 'ana-tick' + (big ? ' big' : '')
      }));
    }
    svg.appendChild(mk('line', { x1: 50, y1: 56, x2: 50, y2: 28, class: 'ana-h', id: 'anaH' }));
    svg.appendChild(mk('line', { x1: 50, y1: 56, x2: 50, y2: 17, class: 'ana-m', id: 'anaM' }));
    svg.appendChild(mk('line', { x1: 50, y1: 57, x2: 50, y2: 13, class: 'ana-s', id: 'anaS' }));
    svg.appendChild(mk('circle', { cx: 50, cy: 50, r: 3, class: 'ana-dot' }));
    miniClockBuilt = true;
  }
  const d = new Date();
  const h = d.getHours() % 12, m = d.getMinutes(), sec = d.getSeconds();
  $('#anaH').setAttribute('transform', 'rotate(' + ((h + m / 60) * 30) + ' 50 50)');
  $('#anaM').setAttribute('transform', 'rotate(' + ((m + sec / 60) * 6) + ' 50 50)');
  $('#anaS').setAttribute('transform', 'rotate(' + (sec * 6) + ' 50 50)');
  $('#miniDigital').textContent = hm(d);
}

const MINI_MEMO_KEY = 'ssgh_mini_memo';
function miniMemoOn() {
  try { return localStorage.getItem(MINI_MEMO_KEY) === '1'; } catch (e) { return false; }
}
function setMiniMemo(on) {

function dutyTimeText(d) {
  if (d.start && d.end) return d.start + '~' + d.end;
  if (d.slot === '교시' && d.period) {
    const pi = (state.data.periods || []).find(x => Number(x.period) === Number(d.period));
    return d.period + '교시' + (pi && pi.start ? ' ' + pi.start : '');
  }
  return d.slot || '';
}

function renderMini() {
  if (!isMini() || !state.data) return;
  const d = new Date();
  const today = todayStr();
  const nowMin = toMin(hm(d));
  $('#miniDate').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')';
  $('#miniName').textContent = state.data.me ? state.data.me.name + ' 선생님' : '';
  drawMiniClock();

  // 지금 상태 : 큰 화면의 상자를 가져와 첫 상자는 시계 옆에, 전체 안내는 그 아래에 둔다
  const tmp = document.createElement('div');
  tmp.innerHTML = $('#nowBox').innerHTML;
  const first = tmp.querySelector('.now-box');
  $('#miniNow').innerHTML = first ? first.outerHTML : '';
  if (first) first.remove();
  $('#miniShare').innerHTML = tmp.innerHTML;

  // 오늘 근무
  const duties = (state.data.duties || []).filter(x => x.date === today);
  $('#miniDutyCnt').textContent = duties.length ? duties.length + '건' : '';
  $('#miniDuty').innerHTML = duties.length
    ? duties.map(x => {
        const past = !!(x.end && hm(d) > x.end);
        return '<div class="mini-line duty-line' + (past ? ' past' : '') + '"><span class="t">' + esc(dutyTimeText(x)) +
          '</span><span class="x">' + esc(x.text) + (past ? ' (끝남)' : '') + '</span></div>';
      }).join('')
    : '<div class="mini-empty">오늘 근무가 없습니다.</div>';

  // 오늘 수업
  const sw = $('#miniMemoSw');
  sw.classList.toggle('on', miniMemoOn());
  sw.setAttribute('aria-checked', String(miniMemoOn()));
  const dow = d.getDay();
  if (dow < 1 || dow > 5) {
    $('#miniClassCnt').textContent = '';
    $('#miniClasses').innerHTML = '<li class="mini-empty" style="display:block">주말입니다.</li>';
  } else {
    const day = DAYS[dow - 1];
    let cnt = 0;
    const rows = periods().map(p => {
      const cls = classAt(day, p.period, today);
      const pd = dutyAtPeriod(today, p.period);
      if (cls) cnt++;
      const done = nowMin >= toMin(p.end);
      const now = nowMin >= toMin(p.start) && nowMin < toMin(p.end);
      const changed = !!changeAt(today, p.period);
      let memo = '';
      if (miniMemoOn()) {
        const rec = findRecord(cls || freeSlotKey(day, p.period), today, p.period);
        if (rec) memo = (rec.progress || (rec.memo || '').split('\n')[0] || '').trim();
      }
      return '<li class="' + (now ? 'now' : done ? 'done' : '') + '">' +
        '<span class="p">' + p.period + '교시</span>' +
        '<span class="t">' + p.start + '~' + p.end + '</span>' +
        '<span class="c' + (cls ? '' : ' empty') + '">' + (cls ? esc(cls) : '—') +
          (changed ? ' <span class="chg" style="font-size:10px;color:var(--chg-text);background:var(--chg-bg);border-radius:4px;padding:0 3px">변경</span>' : '') +
          (pd ? '<span class="duty">' + esc(pd) + '</span>' : '') +
          (memo ? '<span class="mmemo">' + esc(memo) + '</span>' : '') + '</span></li>';
    }).join('');
    $('#miniClassCnt').textContent = cnt + '시간';
    $('#miniClasses').innerHTML = rows || '<li class="mini-empty" style="display:block">교시 시각이 설정되지 않았습니다.</li>';
  }

  // 오늘 일정 (중요한 것 먼저, 3개까지)
  // 개인 일정은 '내 메모'를 켠 기기에서만 (교실 화면에 띄울 수 있으므로)
  const ns = notices().filter(n => n.start <= today && n.end >= today && (!n.private || miniMemoOn()))
    .sort((a, b) => (a.important === b.important ? 0 : a.important ? -1 : 1));
  $('#miniNotices').innerHTML = ns.length
    ? ns.slice(0, 3).map(n => '<div class="mini-line"><span class="x">' +
        (n.important ? '<span class="tag imp">중요</span> ' : '') + esc(n.title) + '</span></div>').join('') +
      (ns.length > 3 ? '<div class="mini-empty">외 ' + (ns.length - 3) + '건</div>' : '')
    : '<div class="mini-empty">오늘 일정이 없습니다.</div>';

  // 점심 (오늘 급식만)
  const meal = meals().find(m => m.date === today && /중식/.test(m.type)) || meals().find(m => m.date === today);
  $('#miniMeal').innerHTML = meal
    ? esc(meal.dishes.join(' · '))
    : '<span class="mini-empty">오늘 급식 정보가 없습니다.</span>';
}
